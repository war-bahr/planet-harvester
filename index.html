<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harvester">
<meta name="application-name" content="Planet Harvester">
<meta name="format-detection" content="telephone=no">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060f'/%3E%3Ccircle cx='28' cy='34' r='16' fill='%23c98a4b'/%3E%3Ccircle cx='23' cy='29' r='4' fill='%23a06a35'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='9' fill='none' stroke='%2363d6ff' stroke-width='3' transform='rotate(-25 32 32)'/%3E%3Ccircle cx='50' cy='16' r='4' fill='%2386f59a'/%3E%3C/svg%3E">

<title>Planet Harvester</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;background:#05060f;color:#e6eaff;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button *{pointer-events:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#top{display:flex;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#0d1230,#0a0e26);border-bottom:1px solid #1d2552;align-items:stretch;z-index:2}
#resbar{display:flex;gap:5px;flex:1;min-width:0}
.res{display:flex;flex-direction:column;justify-content:center;background:#0e1534;border:1px solid #1f2a5c;border-radius:10px;padding:3px 8px;min-width:0;flex:1 1 0;overflow:hidden}
.res .a{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.res .r{color:#8d97cc;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor}
#galchip{min-width:52px;min-height:44px;background:#1a1347;border:1px solid #4b3aa8;border-radius:10px;padding:2px 9px;font-size:11px;color:#cfc4ff;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.2;flex:0 0 auto}
#galchip b{font-size:14px;color:#fff}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#view{position:relative;flex:1 1 44%;min-height:180px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:pointer}
#side{flex:1 1 56%;display:flex;flex-direction:column;min-height:0;background:#080c20;border-top:1px solid #1d2552}
#panel{flex:1;overflow-y:auto;touch-action:pan-y;padding:10px 10px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tabs{display:flex;border-top:1px solid #1d2552;background:#0a0f28;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;min-height:56px;color:#7f89bd;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:#fff}
#tabs button.on::after{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:#5f7bff;border-radius:2px}
#tabs .badge{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:#ff9f2e;box-shadow:0 0 6px #ff9f2e;display:none}
#tabs .badge.show{display:block}
@media (min-width:860px) and (min-aspect-ratio:1/1){
  #main{flex-direction:row}
  #view{flex:1 1 auto}
  #side{flex:0 0 410px;border-top:0;border-left:1px solid #1d2552}
  #tabs{order:-1;border-top:0;border-bottom:1px solid #1d2552}
  #tabs button.on::after{top:auto;bottom:0}
  .res{flex:0 1 150px}
}
.card{background:#0f1636;border:1px solid #222d66;border-radius:12px;padding:10px;margin-bottom:8px}
.card.hl{border-color:#4a63ff;box-shadow:0 0 0 1px #4a63ff33,0 0 18px #3a55ff22}
.card.warn{border-color:#a0661e}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.title{font-weight:700;font-size:15px}
.sub{color:#8d97cc;font-size:12px}
.muted{color:#7f89bd;font-size:12px}
.h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8d97cc;margin:12px 2px 6px;font-weight:700}
.btn{background:linear-gradient(#4867ff,#2f45d6);border:0;border-radius:10px;padding:6px 10px;font-weight:700;min-height:48px;min-width:96px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 #1b2785;transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{background:#1c2348;color:#6b74a3;box-shadow:none;cursor:default}
.btn.alt{background:linear-gradient(#22a37a,#16805e);box-shadow:0 2px 0 #0d5039}
.btn.purple{background:linear-gradient(#9b4dff,#6a2fd6);box-shadow:0 2px 0 #44208a}
.btn.ghost{background:#18204a;box-shadow:none;border:1px solid #2c3878}
.btn.red{background:linear-gradient(#e0475a,#b02c3e);box-shadow:0 2px 0 #6d1724}
.btn .l{font-size:12px}
.costs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;font-weight:600}
.c{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.c i{width:8px;height:8px;border-radius:50%;display:inline-block}
.c.no{color:#ff8a8a}
.btn:disabled .c.no{color:#b06a76}
.icon{width:40px;height:40px;border-radius:10px;background:#18214f;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.icon svg{width:24px;height:24px;fill:none;stroke:#9fb0ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lv{display:inline-block;background:#222c66;border-radius:6px;padding:0 6px;font-size:11px;margin-left:4px;color:#c9d2ff;font-weight:700}
.seg{display:flex;background:#0f1636;border:1px solid #222d66;border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:6px 12px;min-height:44px;min-width:48px;color:#8d97cc;font-weight:700;font-size:12px}
.seg button.on{background:#2f45d6;color:#fff}
.bar{height:8px;background:#0a0f28;border-radius:5px;overflow:hidden;border:1px solid #222d66}
.bar>div{height:100%;background:linear-gradient(90deg,#26c48f,#7cf0b8);border-radius:5px;transition:width .2s}
.bar.full>div{background:linear-gradient(90deg,#ff9f2e,#ffd36b)}
.mix{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:6px}
.btns{display:flex;gap:6px;margin-top:8px}
.btns .btn{flex:1;min-width:0}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ach>div{background:#0f1636;border:1px solid #222d66;border-radius:10px;padding:7px 8px;opacity:.5}
.ach>div.done{opacity:1;border-color:#b58a2a;background:#1f1a12}
.ach b{display:block;font-size:13px}
.ach span{font-size:11px;color:#9aa3cf}
.stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #1d2552;font-size:13px}
#banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(20,16,60,.85);border:1px solid #6a55ff;color:#fff;padding:5px 12px;border-radius:20px;font-weight:700;font-size:13px;display:none;white-space:nowrap;pointer-events:none;box-shadow:0 0 18px #6a55ff66}
#banner.flare{border-color:#ffb02e;box-shadow:0 0 18px #ffb02e66;background:rgba(60,35,10,.85)}
#travelbar{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(10,14,38,.85);border:1px solid #2c3878;border-radius:12px;padding:8px 10px;display:none;pointer-events:none}
#travelbar .bar{margin-top:5px}
#travelbar .bar>div{background:linear-gradient(90deg,#4867ff,#9fb0ff);transition:none}
@keyframes pulse{to{transform:scale(1.07)}}
#toasts{position:absolute;left:0;right:0;top:44px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:3}
.toast{background:rgba(12,18,48,.92);border:1px solid #33408a;padding:6px 12px;border-radius:10px;font-size:13px;font-weight:600;animation:tin .25s ease-out;max-width:92%;text-align:center}
.toast.gold{border-color:#d9a640;color:#ffe3a3}
.toast.good{border-color:#26c48f;color:#b8ffe2}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;background:rgba(2,3,10,.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px;backdrop-filter:blur(3px)}
#modal.hidden{display:none}
#modal .box{background:#0f1636;border:1px solid #3a4aa0;border-radius:16px;padding:16px;max-width:440px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 10px 50px #000a}
#modal h2{margin:0 0 8px;font-size:19px}
#modal p{margin:6px 0;color:#c4cbef}
#modal textarea{width:100%;height:120px;background:#070b1e;color:#cfe;border:1px solid #2c3878;border-radius:8px;font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:6px;-webkit-user-select:text;user-select:text;word-break:break-all}
.gain{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #26306a}
.gain .costs{justify-content:flex-end}
.tag{font-size:10px;font-weight:800;background:#ff9f2e;color:#2a1600;padding:1px 6px;border-radius:6px;margin-left:4px}
.tip{background:#121b45;border-left:3px solid #5f7bff;padding:7px 9px;border-radius:6px;font-size:12px;color:#c4cbef;margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <header id="top"><div id="resbar"></div><button id="galchip" aria-label="Galaxy"></button></header>
  <div id="main">
    <div id="view"><canvas id="cv"></canvas><div id="banner"></div><div id="toasts"></div><div id="travelbar"></div></div>
    <div id="side"><div id="panel"></div><nav id="tabs"></nav></div>
  </div>
</div>
<div id="modal" class="hidden"><div class="box"></div></div>
<script>
(function(){
'use strict';
/* ================= constants & utils ================= */
const SAVE_KEY='planetHarvester.save.v1', VERSION=1, MAXV=1e300;
const RES=['ore','crystal','gas','exotic'];
const RINFO={ore:{n:'Ore',c:'#e7a85f'},crystal:{n:'Crystal',c:'#63d6ff'},gas:{n:'Gas',c:'#86f59a'},exotic:{n:'Exotic',c:'#ff66de'}};
const pw=Math.pow, TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-pw(-2*k+2,2)/2;
const safe=v=>Number.isNaN(v)?0:(v===Infinity||v>MAXV)?MAXV:(v<0?0:v);
const hsl=(h,s,l,a)=>`hsla(${h},${s}%,${l}%,${a==null?1:a})`;
const SUF=['','K','M','B','T'];
function fmt(n){
  if(n==null||Number.isNaN(n))return '0';
  if(!Number.isFinite(n))return n>0?'∞':'-∞';
  if(n<0)return '-'+fmt(-n);
  if(n<1000){ if(n>=100)return Math.floor(n)+''; if(n>=10)return (Math.floor(n*10)/10)+''; return (Math.floor(n*100)/100)+''; }
  let e=Math.floor(Math.log10(n)/3), m=n/pw(1000,e);
  if(m>=999.995){e++;m/=1000;}
  let s; if(e<SUF.length)s=SUF[e]; else {const i=e-SUF.length; s=String.fromCharCode(97+Math.floor(i/26)%26)+String.fromCharCode(97+i%26);}
  return (m<10?m.toFixed(2):m<100?m.toFixed(1):Math.floor(m))+s;
}
function fmtClock(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtTime(s){ s=Math.max(0,Math.floor(s)); if(s<60)return s+'s'; if(s<3600)return Math.floor(s/60)+'m '+(s%60)+'s'; if(s<86400)return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'; return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'; }
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(a,b){let h=(Math.imul(a|0,0x9e3779b1)^Math.imul((b|0)+0x7f4a7c15,0x85ebca6b))>>>0;h^=h>>>13;h=Math.imul(h,0xc2b2ae35)>>>0;h^=h>>>16;return h>>>0;}
const SYL=['ka','ze','ri','tho','vel','mar','qu','an','dor','sy','lo','ne','pha','tur','xi','ber','cor','ul','ma','tes','vor','ix','el','os','ra','gen'];
function pname(r){let s='';const n=2+(r()<.35?1:0);for(let i=0;i<n;i++)s+=SYL[Math.floor(r()*SYL.length)];s=s[0].toUpperCase()+s.slice(1);if(r()<.35)s+=' '+['Prime','II','III','IV','Major','Minor','b','c'][Math.floor(r()*8)];return s;}

/* ================= world generation ================= */
const TYPES={
  rocky:{label:'Rocky',w:{ore:.72,crystal:.16,gas:.12},hues:[22,32,40,12]},
  ice:{label:'Ice World',w:{ore:.24,crystal:.62,gas:.14},hues:[190,200,212]},
  gas:{label:'Gas Giant',w:{ore:.08,crystal:.12,gas:.8},hues:[30,280,160,330,45]},
  lava:{label:'Volcanic',w:{ore:.55,crystal:.33,gas:.12},hues:[8,16]},
  exotic:{label:'Exotic',w:{ore:.18,crystal:.18,gas:.18,exotic:.46},hues:[300,275,320]}
};
const GAL_SUFFIX=['Nebula','Expanse','Reach','Cluster','Spiral','Drift','Veil'];
function genGalaxy(seed,g){
  const r=mulberry(hash(seed,g+1));
  const n=6+Math.min(g,4);
  const pts=[{x:.5,y:.52}];
  for(let i=1;i<n;i++){let best=null,bd=-1;for(let k=0;k<60;k++){const c={x:.08+r()*.84,y:.1+r()*.8};let md=9;for(const p of pts)md=Math.min(md,Math.hypot(p.x-c.x,p.y-c.y));if(md>bd){bd=md;best=c;}if(md>.26)break;}pts.push(best);}
  const pool=g>=1?['rocky','ice','gas','lava','exotic']:['rocky','ice','gas','lava'];
  const types=['rocky'];for(let i=1;i<n;i++)types.push(pool[Math.floor(r()*pool.length)]);
  if(!types.includes('ice'))types[1]='ice'; if(!types.includes('gas'))types[2]='gas'; if(g>=1&&!types.includes('exotic'))types[n-1]='exotic';
  const planets=[];
  for(let i=0;i<n;i++){
    const t=types[i],T=TYPES[t];const d=Math.hypot(pts[i].x-pts[0].x,pts[i].y-pts[0].y);
    const w={ore:0,crystal:0,gas:0,exotic:0,...T.w};
    if(i===0)Object.assign(w,{ore:.7,crystal:.15,gas:.15,exotic:0});
    if(g>=2&&t!=='exotic')w.exotic=.03*Math.min(g-1,6);
    let sum=0;for(const k of RES)sum+=w[k];for(const k of RES)w[k]/=sum;
    planets.push({i,name:(i===0&&g===0)?'Terra Nova':pname(r),type:t,x:pts[i].x,y:pts[i].y,dist:d,
      rich:i===0?1:(.85+r()*.4)*(1+d*2.2),cf:i===0?1:1+d*2.5,w,hue:T.hues[Math.floor(r()*T.hues.length)]+Math.floor(r()*14-7),
      size:i===0?1:.82+r()*.36,seed:Math.floor(r()*1e9),rings:t==='gas'&&r()<.7});
  }
  const gname=g===0?'Local Cluster':pname(r)+' '+GAL_SUFFIX[Math.floor(r()*GAL_SUFFIX.length)];
  return {planets,name:gname,hue:g===0?232:Math.floor(r()*360)};
}

/* ================= state ================= */
let S,P,GAL;
function newState(){
  const now=Date.now();
  return {v:VERSION,seed:(Math.random()*4294967296)>>>0,galaxy:0,res:{ore:0,crystal:0,gas:0,exotic:0,salvage:0},combat:{cannon:0,fighters:0,weapons:0,hull:0,shields:0,armaments:0,critChance:0,critPower:0},sound:true,haptics:true,autobuy:false,tips:{},lastVer:6,raids:0,father:{},trophies:{},
    mods:{drill:0,drones:0,laser:0,engine:0,super:0},laserCharge:0,at:0,travel:null,outposts:{},clock:now,saved:now,created:now,buyMode:1,
    stats:{taps:0,trips:0,rocks:0,built:0,earned:{ore:0,crystal:0,gas:0,exotic:0},play:0},ach:{},seenAch:0,intro:false};
}
function sanitize(o){
  const d=newState();
  if(!o||typeof o!=='object'||!o.res||!o.mods)throw new Error('bad save');
  const s={...d,...o};
  s.res={...d.res};for(const k of [...RES,'salvage'])s.res[k]=safe(+o.res[k]||0);
  s.combat={...d.combat};for(const k in d.combat)s.combat[k]=Math.max(0,Math.floor(+((o.combat||{})[k])||0));
  s.raids=Math.max(0,Math.floor(+o.raids||0));s.lastVer=+o.lastVer||5;s.tips=(o.tips&&typeof o.tips==='object')?o.tips:{};s.sound=o.sound!==false;s.haptics=o.haptics!==false;s.autobuy=!!o.autobuy;if(!o.combat&&s.galaxy>=1){s.res.salvage+=Math.round(400*pw(1.6,s.galaxy));s.defenseGrant=true;}s.father=(o.father&&typeof o.father==='object')?o.father:{};s.trophies=(o.trophies&&typeof o.trophies==='object')?o.trophies:{};
  s.mods={...d.mods};for(const k in d.mods)s.mods[k]=Math.max(0,Math.floor(+o.mods[k]||0));
  s.stats={...d.stats,...(o.stats||{})};s.stats.earned={...d.stats.earned,...((o.stats||{}).earned||{})};
  s.galaxy=Math.max(0,Math.floor(+o.galaxy||0));s.seed=(+o.seed>>>0)||d.seed;
  s.outposts={};for(const k in (o.outposts||{})){const q=o.outposts[k];if(!q)continue;const st={ore:0,crystal:0,gas:0,exotic:0};for(const r of RES)st[r]=safe(+((q.s||{})[r])||0);s.outposts[k]={lvl:Math.max(1,Math.floor(+q.lvl||1)),sto:Math.max(0,Math.floor(+q.sto||0)),tur:Math.max(0,Math.floor(+q.tur||0)),s:st};}
  s.clock=Number.isFinite(+o.clock)?+o.clock:Date.now();s.laserCharge=Math.max(0,+o.laserCharge||0);if(s.galaxy<1)s.mods.super=0;
  s.ach=o.ach&&typeof o.ach==='object'?o.ach:{};
  if(![1,10,'max'].includes(s.buyMode))s.buyMode=1;
  if(s.travel&&!(Number.isFinite(s.travel.to)&&Number.isFinite(s.travel.start)))s.travel=null;
  return s;
}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;return sanitize(JSON.parse(raw));}catch(e){console.warn('save load failed',e);return null;}}
function save(){try{accrueOutposts(Date.now());S.saved=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){console.warn('save failed',e);}}
function setWorld(){GAL=genGalaxy(S.seed,S.galaxy);P=GAL.planets;if(S.at<0||S.at>=P.length)S.at=0;for(const k in S.outposts)if(!P[k])delete S.outposts[k];texCache.clear();nebula=null;}

/* ================= economy ================= */
const gRich=()=>pw(4,S.galaxy);
const gCost=()=>pw(5,S.galaxy);
const achCount=()=>Object.keys(S.ach).length;
const empire=()=>(1+S.galaxy)*(1+.03*achCount());
let flareUntil=0;
const flareOn=()=>performance.now()<flareUntil;
function perDrone(){const d=S.mods.drill;return (1+.6*d)*pw(2,Math.floor(d/25));}
function droneCount(){return 1+S.mods.drones;}
function stationRate(pi){if(pi==null)pi=S.at;const p=P[pi];return safe(droneCount()*perDrone()*p.rich*gRich()*empire()*(flareOn()?3:1)*(dronesEngaged()?.5:1));}
function tapAmt(){const L=S.mods.laser;return safe((2+1.5*L)*pw(1.12,L)*gRich()*empire()+.1*stationRate());}
function outRate(pi){const o=S.outposts[pi];if(!o)return 0;const p=P[pi];return safe(.5*o.lvl*pw(1.05,o.lvl-1)*p.rich*gRich()*empire());}
function capSec(o){return 1800*pw(1.5,o.sto);}
function outCap(pi){const o=S.outposts[pi];return o?safe(outRate(pi)*capSec(o)):0;}
function stored(o){let t=0;for(const k of RES)t+=o.s[k];return t;}
const cc=o=>{const r={};for(const k in o)if(o[k]>0)r[k]=safe(o[k]<1e15?Math.ceil(o[k]):o[k]);return r;};
const MODS={
  drill:{name:'Drill Power',desc:'Every drone mines harder',cost:L=>cc({ore:15*pw(1.25,L),crystal:L>=3?4*pw(1.27,L):0}),
    eff:()=>'Each drone: '+fmt(perDrone()*P[S.at].rich*gRich()*empire())+'/s here',

  drones:{name:'Drone Bay',desc:'+1 mining drone per level',cost:L=>cc({ore:50*pw(1.55,L),gas:12*pw(1.55,L)}),
    eff:()=>droneCount()+' drone'+(droneCount()>1?'s':'')+' active',
    svg:'<path d="M12 5l6 10H6z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>'},

    svg:'<path d="M4 20l7-7M13 11l7-7M14 4h6v6"/><circle cx="11" cy="13" r="2"/>'},

    eff:()=>'Travel speed ×'+(1+.2*S.mods.engine).toFixed(1)+' · fuel use −'+Math.round(100-100/(1+.1*S.mods.engine))+'%',
    svg:'<path d="M12 3c3 3 4 7 3 11h-6c-1-4 0-8 3-11z"/><path d="M9 14l-2 4h10l-2-4M12 18v3"/>'},
  super:{name:'Super Laser',desc:'Charge up, then blast the planet for a huge haul',locked:()=>S.galaxy<1,
    cost:L=>cc({exotic:SUPER_EX*pw(2.2,L)*pw(30,Math.max(0,S.galaxy-1)),crystal:SUPER_CR*pw(2.2,L)*pw(30,Math.max(0,S.galaxy-1))}),
    eff:()=>S.mods.super<1?'Exotic-fuelled blasts worth 12 min of output. Fire by tapping your station.':'Shot cost: <b style="color:#ff9cf0">'+fmt(shotCost())+' exotic</b> · Payout: '+Math.round(shotSec()/60)+' min · Recharge: '+fmtClock(chargeTime())+'<br>Tap the station when its ring is full',
    svg:'<circle cx="7" cy="17" r="3"/><path d="M9 15L20 4M15 4h5v5M12 18l2 2M4 10l2 2"/>'}

/* Super Laser: galaxy 2+ only. Charges only while the game is open (like the station). */
const SUPER_EX=2.5e7,SUPER_CR=2e7;
function chargeTime(){return Math.max(15,120/(1+.2*(S.mods.super-1)));}
function shotSec(){return 720*(1+.5*(Math.max(1,S.mods.super)-1));}
/* station power at richness 1 (no flare): grows with all station upgrades, galaxy richness and empire bonus */
function stationPower(){return droneCount()*perDrone()*gRich()*empire();}
/* per-shot exotic fuel: 60s of station power, 10% cheaper per extra laser level, with a galaxy-scaled floor */
function shotCost(){return safe(Math.ceil(Math.max(5e4*pw(30,Math.max(0,S.galaxy-1)),60*stationPower())*pw(.9,Math.max(1,S.mods.super)-1)));}
const shotAffordable=()=>S.res.exotic>=shotCost();
function shotWeights(){const w={...P[S.at].w};w.exotic=0;let s=0;for(const k of RES)s+=w[k];for(const k of RES)w[k]=s>0?w[k]/s:0;return w;}
const laserOwned=()=>S.galaxy>=1&&S.mods.super>0;
const laserReady=()=>laserOwned()&&S.laserCharge>=chargeTime();
function fireLaser(){if(!laserReady()||S.travel)return;const fuel=shotCost();if(!(S.res.exotic>=fuel)){toast('Need '+fmt(fuel)+' exotic to fire','');return;}S.res.exotic=safe(S.res.exotic-fuel);S.laserCharge=0;S.stats.shots=(S.stats.shots||0)+1;if(inCombat()){combatLaser();vib([20,40,60]);return;}let amt=stationRate()*shotSec();const lc=Math.random()<critChance()*.5;if(lc)amt*=critMult();addSplit(amt,shotWeights());sfx('laser');if(lc&&R.geo)critFx(R.geo.cx,R.geo.cy,amt,'+'+fmt(amt));S.stats.shots=(S.stats.shots||0)+1;R.laserFx=1.3;
  if(R.geo){burst(R.geo.cx,R.geo.cy,70,(()=>{const g={};const w=shotWeights();for(const k of RES)if(w[k]>0)g[k]=1;return g;})());floatText(R.geo.cx,R.geo.cy+R.geo.R+26,'SUPER LASER +'+fmt(amt),'#ff9cf0');}
  vib([20,40,60]);checkAch();}
function costAdd(a,b){const o={...a};for(const k in b)o[k]=(o[k]||0)+b[k];return o;}
function canAfford(c){for(const k in c)if(c[k]>0&&!(S.res[k]>=c[k]))return false;return true;}
function pay(c){for(const k in c)if(c[k]>0)S.res[k]=safe(S.res[k]-c[k]);}
function bulk(fn,L,mode){
  mode=mode||S.buyMode;
  if(mode==='max'){let tot={},n=0;for(;n<1000;n++){const t2=costAdd(tot,fn(L+n));if(!canAfford(t2))break;tot=t2;}return n===0?{n:1,c:fn(L)}:{n,c:tot};}
  let tot={};for(let i=0;i<mode;i++)tot=costAdd(tot,fn(L+i));return {n:mode,c:tot};
}
function addRes(k,a){a=safe(a);if(a<=0)return;S.res[k]=safe(S.res[k]+a);S.stats.earned[k]=safe((S.stats.earned[k]||0)+a);}
function addSplit(total,w){for(const k of RES)if(w[k]>0)addRes(k,total*w[k]);}

/* outposts */
const outCount=()=>Object.keys(S.outposts).length;
function buildCost(pi){const k=gCost()*P[pi].cf*pw(1.8,outCount());return cc({ore:200*k,crystal:50*k});}
function lvlCost(pi,L){const k=gCost()*P[pi].cf;return cc({ore:60*pw(1.45,L)*k,crystal:18*pw(1.45,L)*k,gas:L>=2?10*pw(1.45,L)*k:0});}
function stoCost(pi,L){const k=gCost()*P[pi].cf;return cc({ore:80*pw(1.6,L)*k,gas:25*pw(1.6,L)*k});}
/* The single source of truth for outpost production: used every frame AND for offline time. */
function accrueOutposts(now){
  let dt=(now-S.clock)/1000;
  if(!Number.isFinite(dt)||dt<0){S.clock=now;return;}
  if(dt===0)return;
  S.clock=now;
  for(const pi in S.outposts){
    const o=S.outposts[pi],rate=outRate(pi),cap=rate*capSec(o),cur=stored(o);
    const add=Math.min(rate*dt,Math.max(0,cap-cur));
    if(add>0){const w=P[pi].w;for(const k of RES)if(w[k]>0)o.s[k]=safe(o.s[k]+add*w[k]);}
  }
}
function snapshot(){const m={};for(const pi in S.outposts)m[pi]={...S.outposts[pi].s};return m;}
function diffSnap(snap){const out=[];for(const pi in S.outposts){const o=S.outposts[pi],b=snap[pi]||{};const g={};let any=0;for(const k of RES){g[k]=Math.max(0,o.s[k]-(b[k]||0));any+=g[k];}out.push({pi:+pi,g,any,full:stored(o)>=outCap(pi)*.999});}return out;}
function collect(pi,quiet){
  const o=S.outposts[pi];if(!o)return null;accrueOutposts(Date.now());
  const got={};let tot=0;for(const k of RES){if(o.s[k]>0){got[k]=o.s[k];tot+=o.s[k];addRes(k,o.s[k]);o.s[k]=0;}}
  if(tot>0&&!quiet){sfx('coin');toast('Collected '+Object.keys(got).map(k=>fmt(got[k])+' '+RINFO[k].n.toLowerCase()).join(', '),'good');if(R.geo)burst(R.geo.ox,R.geo.oy,24,got);}
  return tot>0?got:null;
}
function buildOutpost(){
  const pi=S.at;if(S.travel||S.outposts[pi])return;const c=buildCost(pi);if(!canAfford(c))return;
  accrueOutposts(Date.now());pay(c);S.outposts[pi]={lvl:1,sto:0,tur:0,s:{ore:0,crystal:0,gas:0,exotic:0}};S.stats.built++;
  toast('Outpost established on '+P[pi].name+'!','gold');checkAch();save();renderPanel();
}
function upOutpost(pi){const o=S.outposts[pi];if(!o)return;const b=bulk(L=>lvlCost(pi,L),o.lvl);if(!canAfford(b.c))return;accrueOutposts(Date.now());pay(b.c);o.lvl+=b.n;checkAch();}
function upStorage(pi){const o=S.outposts[pi];if(!o)return;const c=stoCost(pi,o.sto);if(!canAfford(c))return;accrueOutposts(Date.now());pay(c);o.sto++;}
function buyMod(k){if(MODS[k].locked&&MODS[k].locked())return;const L=S.mods[k];const b=bulk(MODS[k].cost,L);if(!canAfford(b.c))return;pay(b.c);S.mods[k]+=b.n;checkAch();}

/* travel */
const pdist=(a,b)=>Math.hypot(P[a].x-P[b].x,P[a].y-P[b].y);
function travelCost(to,instant){return cc({gas:6*(1+pdist(S.at,to)*10)*gRich()/(1+.1*S.mods.engine)*(instant?3:1)});}
function travelTime(to){return (2+pdist(S.at,to)*25)/(1+.2*S.mods.engine);}
function startTravel(to,instant){
  if(S.travel||to===S.at||!P[to])return;if(C.father){toast('You cannot flee the Father Ship!','');return;}const c=travelCost(to,instant);if(!canAfford(c)){toast('Not enough gas for that trip','');return;}
  pay(c);if(C.raid){C.raid=null;for(const e of C.enemies)e.state='flee';}
  if(instant){S.at=to;arrive(true);return;}
  S.travel={from:S.at,to,start:Date.now(),dur:travelTime(to)*1000};parts.length=0;rocks.length=0;
  if(R.tab==='map'){}renderPanel();save();
}
function updateTravel(now){if(S.travel&&now>=S.travel.start+S.travel.dur){S.at=S.travel.to;S.travel=null;arrive(false);}}
function arrive(instant){
  S.stats.trips++;R.sel=null;parts.length=0;
  if(instant)R.warpFlash=1;
  toast('Arrived at '+P[S.at].name,'');
  if(S.outposts[S.at])setTimeout(()=>collect(S.at),350);
  if(C.oraid&&C.oraid.pi===S.at&&!C.father)setTimeout(launchORaid,700);
  checkAch();renderPanel();save();
}

/* galaxy */
function jumpCost(){const g=S.galaxy,k=pw(30,g);const c={ore:1e6*k,crystal:2.5e5*k,gas:2.5e5*k};if(g>=1)c.exotic=2e3*pw(30,g-1);return cc(c);}
function jumpGalaxy(){
  const c=jumpCost();if(!canAfford(c)||S.travel||C.father)return;if(!fatherBeaten()){toast('Defeat the Father Ship to jump','');return;}
  C.raid=null;C.enemies.length=0;C.shots.length=0;C.grace=60;
  for(const pi in S.outposts)collect(pi,true);
  pay(c);S.galaxy++;S.outposts={};S.at=0;S.travel=null;R.sel=null;C.oraid=null;
  setWorld();R.warpFlash=1.5;parts.length=0;rocks.length=0;
  toast('Welcome to the '+GAL.name+'!','gold');checkAch();save();R.tab='station';renderTabs();renderPanel();
}

const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),view=$('#view');
let W=1,H=1,DPR=1;
function resize(){const r=view.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
const R={laserFx:0,tab:'station',sel:null,geo:null,warpFlash:0,evtT:75,showerUntil:0,nextRock:0,lastTapHint:0};
const parts=[],floats=[],rocks=[];
const texCache=new Map();let nebula=null;
const STARS=[0,1,2].map(l=>{const r=mulberry(77+l);return Array.from({length:[110,55,22][l]},()=>({x:r(),y:r(),b:.25+r()*.75,tw:r()*TAU}));});
let starOff=0;

function getTex(p){
  const key=S.galaxy+':'+p.i;if(texCache.has(key))return texCache.get(key);
  const Wt=256,Ht=128,c=document.createElement('canvas');c.width=Wt;c.height=Ht;const x=c.getContext('2d');const r=mulberry(p.seed);const h=p.hue;
  const blob=(cx,cy,rad,col)=>{x.fillStyle=col;for(const dx of[-Wt,0,Wt]){x.beginPath();x.arc(cx+dx,cy,rad,0,TAU);x.fill();}};
  if(p.type==='gas'){
    const ph1=r()*6,ph2=r()*6,f1=.08+r()*.08,f2=.25+r()*.2;
    for(let y=0;y<Ht;y++){const l=50+12*Math.sin(y*f1+ph1)+5*Math.sin(y*f2+ph2);x.fillStyle=hsl(h+8*Math.sin(y*.05+ph2),55,l);x.fillRect(0,y,Wt,1);}
    for(let i=0;i<40;i++){const yy=r()*Ht;x.fillStyle=hsl(h,50,50+r()*25,.25);x.fillRect(0,yy,Wt,1+r()*3);}
    const sx=r()*Wt,sy=Ht*(.3+r()*.4);for(const dx of[-Wt,0,Wt]){x.fillStyle=hsl(h+20,65,38,.85);x.beginPath();x.ellipse(sx+dx,sy,14,7,0,0,TAU);x.fill();x.fillStyle=hsl(h+20,70,60,.6);x.beginPath();x.ellipse(sx+dx,sy,8,3.5,0,0,TAU);x.fill();}
  }else{
    const base={rocky:[h,32,42],ice:[h,40,76],lava:[h,55,18],exotic:[h,55,34]}[p.type];
    x.fillStyle=hsl(...base);x.fillRect(0,0,Wt,Ht);
    for(let i=0;i<170;i++)blob(r()*Wt,r()*Ht,3+r()*16,hsl(base[0]+r()*20-10,base[1],clamp(base[2]+r()*24-12,4,95),.35));
    if(p.type==='rocky'){for(let i=0;i<26;i++){const cx=r()*Wt,cy=r()*Ht,rr=2+r()*7;blob(cx,cy,rr,hsl(h,25,28,.55));blob(cx-rr*.25,cy-rr*.25,rr*.7,hsl(h,25,38,.5));}
      if(r()<.5)for(let i=0;i<30;i++)blob(r()*Wt,r()*Ht,4+r()*12,hsl(110+r()*40,35,35,.35));}
    if(p.type==='ice'){x.fillStyle='rgba(255,255,255,.75)';x.fillRect(0,0,Wt,12);x.fillRect(0,Ht-12,Wt,12);for(let i=0;i<40;i++){x.strokeStyle='rgba(120,190,230,.35)';x.lineWidth=1;x.beginPath();const y0=r()*Ht;x.moveTo(0,y0);x.bezierCurveTo(80,y0+r()*20-10,170,y0+r()*20-10,Wt,y0);x.stroke();}}
    if(p.type==='lava'){x.lineCap='round';for(let i=0;i<18;i++){let px=r()*Wt,py=r()*Ht;x.strokeStyle=hsl(25+r()*25,100,55,.9);x.lineWidth=1+r()*2;x.shadowColor='#ff6a00';x.shadowBlur=6;x.beginPath();x.moveTo(px,py);for(let k=0;k<8;k++){px+=r()*16-8;py+=r()*12-6;x.lineTo(px,py);}x.stroke();}x.shadowBlur=0;}
    if(p.type==='exotic'){for(let i=0;i<14;i++){x.strokeStyle=hsl(i%2?185:315,100,65,.55);x.lineWidth=2+r()*3;x.beginPath();x.arc(r()*Wt,r()*Ht,8+r()*28,r()*6,r()*6+2.5);x.stroke();}}
  }
  texCache.set(key,c);return c;
}
function drawPlanet(p,x,y,r,scroll,glow){
  const tex=getTex(p);
  const gl=ctx.createRadialGradient(x,y,r*.85,x,y,r*(glow||1.4));gl.addColorStop(0,hsl(p.hue,80,62,.38));gl.addColorStop(1,hsl(p.hue,80,62,0));
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,r*(glow||1.4),0,TAU);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
  const tw=r*4,th=r*2;let off=-(scroll%tw);if(off>0)off-=tw;
  ctx.drawImage(tex,x-r+off,y-r,tw,th);ctx.drawImage(tex,x-r+off+tw,y-r,tw,th);
  const sh=ctx.createRadialGradient(x-r*.4,y-r*.4,r*.05,x,y,r*1.05);sh.addColorStop(0,'rgba(255,255,255,.18)');sh.addColorStop(.45,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,12,.78)');
  ctx.fillStyle=sh;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();
  ctx.strokeStyle=hsl(p.hue,90,80,.3);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r,-2.6,-.4);ctx.stroke();
}
function drawRings(p,x,y,r){ctx.save();for(let i=0;i<3;i++){ctx.strokeStyle=hsl(p.hue+20,40,70,.16-i*.03);ctx.lineWidth=r*.12;ctx.beginPath();ctx.arc(x,y,r*(1.28+i*.16),0,TAU);ctx.stroke();}ctx.restore();}
function getNebula(){
  if(nebula)return nebula;const c=document.createElement('canvas');c.width=c.height=384;const x=c.getContext('2d');const r=mulberry(hash(S.seed,999+S.galaxy));const h=GAL.hue;
  for(let i=0;i<9;i++){const cx=r()*384,cy=r()*384,rad=80+r()*160;const g=x.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,hsl(h+r()*80-40,70,45,.16));g.addColorStop(1,hsl(h,70,40,0));x.fillStyle=g;x.fillRect(0,0,384,384);}

function drawBackground(dt,speed){
  ctx.fillStyle='#04050d';ctx.fillRect(0,0,W,H);
  const s=Math.max(W,H);ctx.drawImage(getNebula(),(W-s)/2,(H-s)/2,s,s);
  starOff+=dt*speed;const t=performance.now()/1000;
  for(let l=0;l<3;l++){const par=[.25,.55,1][l],sz=[.8,1.3,1.9][l];
    for(const st of STARS[l]){const x=st.x*W,y=(((st.y+starOff*par)%1)+1)%1*H;const a=st.b*(.75+.25*Math.sin(t*2+st.tw));
      if(speed>.05){ctx.strokeStyle=`rgba(200,215,255,${a})`;ctx.lineWidth=sz;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-Math.min(H*.3,speed*par*H*.12));ctx.stroke();}
      else{ctx.fillStyle=`rgba(220,230,255,${a})`;ctx.fillRect(x,y,sz,sz);}}}
}
function drawStation(x,y,s,t){

  for(const sd of[-1,1]){ctx.strokeStyle='#8c96c8';ctx.lineWidth=Math.max(1,s*.08);ctx.beginPath();ctx.moveTo(sd*s*.8,0);ctx.lineTo(sd*s*1.05,0);ctx.stroke();

    ctx.strokeStyle='rgba(140,170,255,.5)';ctx.beginPath();for(let k=1;k<4;k++){ctx.moveTo(px+k*s*.3,-s*.38);ctx.lineTo(px+k*s*.3,s*.38);}ctx.moveTo(px,0);ctx.lineTo(px+s*1.2,0);ctx.stroke();}

  if(laserOwned()){const g0=R.geo,ds=Math.hypot(g0.sx-x,g0.sy-y);if(ds<Math.max(34,g0.s*1.9)&&Math.hypot(g0.cx-x,g0.cy-y)>g0.R){const closer=C.enemies.some(e=>e.vis>.5&&Math.hypot(e.x-x,e.y-y)<Math.min(ds,Math.max(30,e.r*1.6)));if(!closer){stationTap();return;}}}

  for(let i=rocks.length-1;i>=0;i--){const k=rocks[i];if(Math.hypot(k.x-x,k.y-y)<Math.max(28,k.r*1.6)){smashRock(i);return;}}
  const g=R.geo;
  if(S.outposts[S.at]&&Math.hypot(g.ox-x,g.oy-y)<Math.max(26,g.os*2.4)&&stored(S.outposts[S.at])>0){collect(S.at);return;}

    let amt=tapAmt();const w=P[S.at].w;const cr=rollCrit();if(cr)amt*=critMult();addSplit(amt,w);S.stats.taps++;if(cr)critFx(x,y,amt,'+'+fmt(amt));else sfx('tap');

  }
});

  }

        else{const a=Math.atan2(ty-e.y,tx-e.x)+Math.sin(e.t*5)*.5;e.vx=Math.cos(a)*sp;e.vy=Math.sin(a)*sp;}}}

      e.wave-=dt;if(e.wave<1.2)e.bay=1;if(e.wave<=0){e.wave=10;e.bay=0;const n=3+Math.min(3,S.galaxy+1);for(let k=0;k<n;k++){const s2=spawnEnemy(pickType(),e.x+(k-n/2)*12,e.y+e.r*.6);s2.vy=40;}floatText(e.x,e.y+e.r+10,'LAUNCHING FIGHTERS','#ff9f6a');}
      e.cd-=dt;if(e.cd<=0){e.cd=2;fireShot(e,null,'station',12*pw(1.4,S.galaxy),m*.5,'#ff5a3a');}}

/* ================= outpost raids: live (map countdown) + offline (capped) ================= */
const RAID_PER_HOUR=.5,RAID_MAX_FRAC=.10,ABSENCE_MAX_FRAC=.20,ORAID_TIME=90;
function outDefense(pi){const o=S.outposts[pi];if(!o)return 0;const t=o.tur||0;return (6+14*t*pw(1.12,t)+maxShield()/25)*eScale();}
function pirateStrength(){return 8*eScale()*(1+.25*S.galaxy)*(S.galaxy>=1?1.6*1.15:1.3);}
function repelChance(pi){const D=outDefense(pi),p=pirateStrength();return D/(D+p);}
function turCost(pi,L){return cc({salvage:6*pw(1.38,L)*eScale(),ore:80*pw(1.5,L)*gCost()*P[pi].cf});}
function buyTurret(pi){const o=S.outposts[pi];if(!o)return;const b=bulk(L=>turCost(pi,L),o.tur||0);if(!canAfford(b.c))return;pay(b.c);o.tur=(o.tur||0)+b.n;}
/* One raid on an outpost. Steals only STORED resources (never levels), max 10% of storage per raid; optional absence budget. */
function resolveRaid(pi,budget){
  const o=S.outposts[pi];if(!o)return null;const D=outDefense(pi),ps=pirateStrength()*(.6+Math.random()*.8);
  if(Math.random()*(D+ps)<D){const sal=Math.max(1,Math.round(2*eScale()));addRes('salvage',sal);return {won:true,salvage:sal,frac:0,lost:{}};}
  const frac=Math.min(RAID_MAX_FRAC,.12*ps/(D+ps)*(S.galaxy===0?.5:1));
  const st=stored(o);let take=st*frac;if(budget)take=Math.min(take,Math.max(0,budget.left));if(budget)budget.left-=take;
  const lost={};if(st>0&&take>0){const r=take/st;for(const k of RES){const a=o.s[k]*r;if(a>0){o.s[k]=safe(o.s[k]-a);lost[k]=a;}}}
  return {won:false,lost,frac:st>0?take/st:0,salvage:0};
}
/* Offline: each outpost rolls a 50% raid chance per hour away (max 48h). Total loss per outpost per absence <= 20% of its storage. */
function offlineRaids(secs){
  const rep={};if(!(secs>=600))return rep;const hours=Math.min(48,secs/3600),full=Math.floor(hours);
  for(const pi in S.outposts){const o=S.outposts[pi],base=stored(o),budget={left:base*ABSENCE_MAX_FRAC};
    let n=0;for(let h=0;h<full;h++)if(Math.random()<RAID_PER_HOUR)n++;if(Math.random()<(hours-full)*RAID_PER_HOUR)n++;
    if(!n)continue;const r={raids:n,repelled:0,salvage:0,lost:{},lostTotal:0,base,maxFrac:0};
    for(let i=0;i<n;i++){const x=resolveRaid(pi,budget);if(x.won){r.repelled++;r.salvage+=x.salvage;}else{r.maxFrac=Math.max(r.maxFrac,x.frac);for(const k in x.lost){r.lost[k]=(r.lost[k]||0)+x.lost[k];r.lostTotal+=x.lost[k];}}}
    rep[pi]=r;}
  return rep;
}

function autoBuy(){let best=null,bc=Infinity;for(const k of ['drill','drones','laser']){const c=MODS[k].cost(S.mods[k]);let sum=0;for(const r in c)sum+=c[r];if(canAfford(c)&&sum<bc){bc=sum;best=k;}}if(best){pay(MODS[best].cost(S.mods[best]));S.mods[best]++;}}
function frame(ts){
  let dt=(ts-lastT)/1000;lastT=ts;if(!(dt>=0))dt=0;dt=Math.min(dt,.25);
  const now=Date.now(),t=ts/1000;
  try{
    accrueOutposts(now); // outposts: always, based on wall-clock
    updateTravel(now);
    if(!document.hidden){
      S.stats.play+=dt;
      C.grace=Math.max(0,C.grace-dt);
      updateOutpostRaid(dt);
      if(!S.travel){addSplit(stationRate()*dt,P[S.at].w);if(laserOwned())S.laserCharge=Math.min(chargeTime(),S.laserCharge+dt*(inCombat()?3:1));if(R.tab!=='map')updateCombat(dt,t);} // station & Super Laser: only while visible
      if(!inCombat())R.evtT-=dt;if(R.evtT<=0){R.evtT=70+Math.random()*90;if(!S.travel){if(Math.random()<.62){R.showerUntil=t+14;R.nextRock=t;toast('Asteroid shower incoming!','gold');}else{flareUntil=performance.now()+30000;toast('Solar flare! Station output ×3 for 30s','gold');}}}
      if(t<R.showerUntil&&t>=R.nextRock&&!S.travel&&R.tab!=='map'){spawnRock();R.nextRock=t+.9+Math.random()*.8;}
    }
    if(R.tab==='map'){drawBackground(dt,.0015);drawMap(t);}
    else if(S.travel){drawBackground(dt,1.2);drawTravel(dt,t);drawFx(dt);}
    else{const sh=C.shake;if(sh>0){ctx.save();ctx.translate((Math.random()-.5)*sh*2,(Math.random()-.5)*sh*2);}drawBackground(dt,.003);drawOrbit(dt,t);drawFx(dt);if(sh>0)ctx.restore();}
    if(R.tab==='map'&&R.warpFlash>0)drawFx(dt);
    uiAcc+=dt;if(uiAcc>.2){uiAcc=0;updTop();runUpd();}
    achAcc+=dt;if(achAcc>1){achAcc=0;checkAch();updateBadges();}
    saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}
    abAcc+=dt;if(abAcc>2){abAcc=0;if(S.autobuy&&S.galaxy>=1&&!document.hidden)autoBuy();}
  }catch(e){console.error(e);}
  requestAnimationFrame(frame);
}
