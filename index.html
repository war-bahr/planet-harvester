<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;background:#05060f;color:#e6eaff;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button *{pointer-events:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#top{display:flex;gap:4px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;background:linear-gradient(#0d1230,#0a0e26);border-bottom:1px solid #1d2552;align-items:stretch;z-index:2}
#resbar{display:flex;gap:3px;flex:1 1 auto;min-width:0}
.res{display:flex;flex-direction:column;justify-content:center;background:#0e1534;border:1px solid #1f2a5c;border-radius:10px;padding:3px 4px;min-width:0;min-height:40px;flex:1 1 0;overflow:hidden}
.res .a{display:flex;align-items:center;gap:3px;font-weight:700;font-size:13px;line-height:1.15;white-space:nowrap;min-width:0}
.res .a .v{min-width:0;overflow:visible}
.res .r{color:#8d97cc;font-size:10px;line-height:1.15;white-space:nowrap;letter-spacing:-.01em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor}
#galchip{min-width:44px;min-height:44px;background:#1a1347;border:1px solid #4b3aa8;border-radius:10px;padding:2px 5px;font-size:10px;color:#cfc4ff;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.15;flex:0 0 auto;max-width:38%;white-space:nowrap}
#galchip b{font-size:13px;color:#fff;line-height:1.15}
#main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#view{position:relative;flex:1 1 44%;min-height:180px;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block;cursor:pointer}
#side{flex:0 1 56%;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#080c20;border-top:1px solid #1d2552;transition:flex-basis .2s cubic-bezier(.25,.8,.3,1)}
#panel{flex:1 1 0;min-height:0;overflow-y:auto;touch-action:pan-y;padding:10px 10px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transition:padding .2s cubic-bezier(.25,.8,.3,1)}
#app.fs #side{flex-basis:calc(var(--tabsh,calc(57px + env(safe-area-inset-bottom))) + 1px)}
#app.fs #panel{padding-top:0;padding-bottom:0;overflow:hidden}
#app.notr #side,#app.notr #panel{transition:none}
#tabs{flex:0 0 auto;display:flex;border-top:1px solid #1d2552;background:#0a0f28;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;min-height:56px;color:#7f89bd;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:#fff}
#tabs button.on::after{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:#5f7bff;border-radius:2px}
#tabs .badge{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:#ff9f2e;box-shadow:0 0 6px #ff9f2e;display:none}
#tabs .badge.show{display:block}
#tabs .chev{display:none;position:absolute;top:9px;right:calc(50% + 14px);width:6px;height:6px;border-right:1.6px solid #8fa2ff;border-bottom:1.6px solid #8fa2ff;transform:rotate(45deg);opacity:.7;transition:transform .2s,opacity .2s}
#tabs button.on .chev{display:block}
#app.fs #tabs button.on .chev{transform:translateY(3px) rotate(-135deg);opacity:1;border-color:#c3ccff}
#app.fs #tabs button.on::after{left:30%;right:30%;background:#9fb0ff}
@media (min-width:860px) and (min-aspect-ratio:1/1){
  #main{flex-direction:row}
  #view{flex:1 1 auto}
  #side{flex:0 0 410px;border-top:0;border-left:1px solid #1d2552}
  #tabs{order:-1;border-top:0;border-bottom:1px solid #1d2552}
  #tabs button.on::after{top:auto;bottom:0}
  #app.fs #side{position:absolute;top:0;right:0;width:410px;flex:none;border-left:0;border-bottom:1px solid #1d2552;border-bottom-left-radius:12px;background:rgba(8,12,32,.88);z-index:4}
  #app.fs #panel{display:none}
  #app.fs #tabs{border-bottom:0}
  #app.fs #tabs button.on .chev{transform:translateY(-1px) rotate(45deg)}
  #tabs button.on .chev{transform:translateY(3px) rotate(-135deg)}
  .res{flex:0 1 150px}
}
.card{background:#0f1636;border:1px solid #222d66;border-radius:12px;padding:10px;margin-bottom:8px}
.card.hl{border-color:#4a63ff;box-shadow:0 0 0 1px #4a63ff33,0 0 18px #3a55ff22}
.card.warn{border-color:#a0661e}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.title{font-weight:700;font-size:15px}
.sub{color:#8d97cc;font-size:12px}
.muted{color:#7f89bd;font-size:12px}
.h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8d97cc;margin:12px 2px 6px;font-weight:700}

.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{background:#1c2348;color:#6b74a3;box-shadow:none;cursor:default}
.btn.alt{background:linear-gradient(#22a37a,#16805e);box-shadow:0 2px 0 #0d5039}
.btn.purple{background:linear-gradient(#9b4dff,#6a2fd6);box-shadow:0 2px 0 #44208a}
.btn.ghost{background:#18204a;box-shadow:none;border:1px solid #2c3878}
.btn.red{background:linear-gradient(#e0475a,#b02c3e);box-shadow:0 2px 0 #6d1724}
.btn .l{font-size:12px}
.costs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;font-weight:600}
.c{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.c i{width:8px;height:8px;border-radius:50%;display:inline-block}
.c.no{color:#ff8a8a}
.btn:disabled .c.no{color:#b06a76}
.icon{width:40px;height:40px;border-radius:10px;background:#18214f;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.icon svg{width:24px;height:24px;fill:none;stroke:#9fb0ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lv{display:inline-block;background:#222c66;border-radius:6px;padding:0 6px;font-size:11px;margin-left:4px;color:#c9d2ff;font-weight:700}
.seg{display:flex;background:#0f1636;border:1px solid #222d66;border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:6px 12px;min-height:44px;min-width:48px;color:#8d97cc;font-weight:700;font-size:12px}
.seg button.on{background:#2f45d6;color:#fff}
.bar{height:8px;background:#0a0f28;border-radius:5px;overflow:hidden;border:1px solid #222d66}
.bar>div{height:100%;background:linear-gradient(90deg,#26c48f,#7cf0b8);border-radius:5px;transition:width .2s}
.bar.full>div{background:linear-gradient(90deg,#ff9f2e,#ffd36b)}
.mix{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:6px}
.btns{display:flex;gap:6px;margin-top:8px}
.btns .btn{flex:1;min-width:0}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ach>div{background:#0f1636;border:1px solid #222d66;border-radius:10px;padding:7px 8px;opacity:.5}
.ach>div.done{opacity:1;border-color:#b58a2a;background:#1f1a12}
.ach b{display:block;font-size:13px}
.ach span{font-size:11px;color:#9aa3cf}
.stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #1d2552;font-size:13px}
#banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(20,16,60,.85);border:1px solid #6a55ff;color:#fff;padding:5px 12px;border-radius:20px;font-weight:700;font-size:13px;display:none;white-space:nowrap;pointer-events:none;box-shadow:0 0 18px #6a55ff66}

#travelbar .bar{margin-top:5px}
#travelbar .bar>div{background:linear-gradient(90deg,#4867ff,#9fb0ff);transition:none}
@keyframes pulse{to{transform:scale(1.07)}}
#toasts{position:absolute;left:0;right:0;top:44px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:3}
.toast{background:rgba(12,18,48,.92);border:1px solid #33408a;padding:6px 12px;border-radius:10px;font-size:13px;font-weight:600;animation:tin .25s ease-out;max-width:92%;text-align:center}
.toast.gold{border-color:#d9a640;color:#ffe3a3}
.toast.good{border-color:#26c48f;color:#b8ffe2}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;background:rgba(2,3,10,.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px;backdrop-filter:blur(3px)}
#modal.hidden{display:none}
#modal .box{background:#0f1636;border:1px solid #3a4aa0;border-radius:16px;padding:16px;max-width:440px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 10px 50px #000a}
#modal h2{margin:0 0 8px;font-size:19px}
#modal p{margin:6px 0;color:#c4cbef}
#modal textarea{width:100%;height:120px;background:#070b1e;color:#cfe;border:1px solid #2c3878;border-radius:8px;font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:6px;-webkit-user-select:text;user-select:text;word-break:break-all}
.gain{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #26306a}
.gain .costs{justify-content:flex-end}
.tag{font-size:10px;font-weight:800;background:#ff9f2e;color:#2a1600;padding:1px 6px;border-radius:6px;margin-left:4px}
.tip{background:#121b45;border-left:3px solid #5f7bff;padding:7px 9px;border-radius:6px;font-size:12px;color:#c4cbef;margin-bottom:8px}
/* v11 armada / moon */
#banner.armada{border-color:#ff4d5e;box-shadow:0 0 20px #ff4d5e88;background:rgba(60,10,18,.9);animation:apulse 1s ease-in-out infinite alternate}
@keyframes apulse{to{box-shadow:0 0 28px #ff4d5e}}
#moonfire{position:absolute;right:10px;bottom:76px;width:58px;height:58px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#1a3a62,#0a0f28);box-shadow:0 2px 10px #000a,0 0 0 1px #2c5878;z-index:3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;--fc:#9fe6ff}
#moonfire.hidden{display:none}
#moonfire .ic{display:flex;opacity:.55}#moonfire .ic svg{width:22px;height:22px;fill:none;stroke:var(--fc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#moonfire .lb{font-size:10px;font-weight:800;color:#c4cbef;line-height:1;font-variant-numeric:tabular-nums}
#moonfire.ready{box-shadow:0 0 0 2px var(--fc),0 0 18px var(--fc)}#moonfire.ready .ic{opacity:1}#moonfire.ready .lb{color:#fff}

/* v10 factions */
#abil{position:absolute;right:10px;bottom:10px;width:58px;height:58px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#1f2a62,#0a0f28);box-shadow:0 2px 10px #000a,0 0 0 1px #2c3878;z-index:3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;--fc:#9fb0ff}
#abil.hidden{display:none}
#abil>svg{position:absolute;left:0;top:0;width:58px;height:58px;transform:rotate(-90deg)}
#abil .tr{fill:none;stroke:#1d2552;stroke-width:4}
#abil .pr{fill:none;stroke:var(--fc);stroke-width:4;stroke-dasharray:163.4;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
#abil .ic{display:flex;opacity:.55}
#abil .ic svg{width:22px;height:22px;fill:none;stroke:var(--fc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#abil .lb{font-size:10px;font-weight:800;color:#c4cbef;line-height:1;font-variant-numeric:tabular-nums}
#abil.ready{box-shadow:0 0 0 2px var(--fc),0 0 18px var(--fc);animation:abilp 1s ease-in-out infinite alternate}
@keyframes abilp{to{box-shadow:0 0 0 3px var(--fc),0 0 26px var(--fc)}}
#abil.ready .ic{opacity:1}#abil.ready .lb{color:#fff}
#travelbar.abl{right:78px}
.emb{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#26306a,#0c1236);box-shadow:inset 0 0 0 1.5px var(--fc),0 0 14px -5px var(--fc)}
.emb svg{width:24px;height:24px;fill:none;stroke:var(--fc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.emb.big{width:52px;height:52px;border-radius:14px}.emb.big svg{width:30px;height:30px}
.femb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.femb>div{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.fsec{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:12px;color:#c4cbef}.fsec b{color:#fff;font-size:13px}
.pips{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}.pips i{width:12px;height:12px;border-radius:3px;background:#1c2348;border:1px solid #2c3878}.pips i.on{background:linear-gradient(#ffd36b,#ff9f2e);border-color:#ffd36b;box-shadow:0 0 6px #ffb02e88}
.row.ship{margin:6px 0;gap:8px}.shipc{padding:4px 0 8px;border-bottom:1px solid #1d2552}.shipc:last-of-type{border-bottom:0}.shipc .btns{margin-top:4px}.shipc .btns .btn{flex:1}.sicon{width:40px;height:40px;border-radius:10px;background:#1a0f18;border:1px solid #4a1c2a;flex:0 0 auto;display:flex;align-items:center;justify-content:center}.sicon img{width:36px;height:36px}
.btn.sm{min-width:72px;min-height:44px;padding:4px 6px}.btn.sm .costs{font-size:10px;gap:3px}
#mg{position:fixed;inset:0;z-index:9;background:#04050d;touch-action:none;overscroll-behavior:none}
#mg.hidden{display:none}
#mgc{position:absolute;left:0;top:0;touch-action:none;display:block}
#mghud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(rgba(13,18,48,.95),rgba(10,14,38,0));pointer-events:none}
#mghud>*{pointer-events:auto}
#mgx{min-width:72px;min-height:44px;flex:0 0 auto}
#mgt{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden}
#mgt svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#mgs{flex:1 0 auto;text-align:right;font-size:12px;color:#c4cbef;white-space:nowrap;font-variant-numeric:tabular-nums}
#mgres{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,3,10,.62)}
#mgres.hidden{display:none}
#mgres .box{background:#0f1636;border:1px solid #3a4aa0;border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 10px 50px #000a}
#mgres h2{margin:8px 0 6px;font-size:20px;text-align:center}#mgres p{margin:4px 0;color:#c4cbef;font-size:13px}

/* v15 goals / prestige / results / warp / coach */
.goalrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #26306a;min-height:34px;font-size:12px}
.goalrow:last-child{border-bottom:0}
#rescard{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,3,10,.72)}
#rescard.hidden{display:none}
#rescard .box{background:#0f1636;border:1px solid #4a63ff;border-radius:16px;padding:18px;max-width:360px;width:100%;box-shadow:0 10px 50px #000a;text-align:center}
#rescard .rc-brand{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8d97cc;margin-bottom:4px}
#rescard h2{margin:6px 0;font-size:22px}

.coach .box{pointer-events:auto;background:#121b45;border:1px solid #5f7bff;border-radius:12px;padding:12px;box-shadow:0 8px 30px #000a}
.coach b{display:block;margin-bottom:4px}
.coach p{margin:0 0 8px;font-size:12px;color:#c4cbef}

</style>

<body>
<div id="app">
  <header id="top"><div id="resbar"></div><button id="galchip" aria-label="Galaxy"></button></header>
  <div id="main">
    <div id="view"><canvas id="cv"></canvas><div id="banner"></div><div id="toasts"></div><div id="travelbar"></div><button id="moonfire" class="hidden" aria-label="Moon Laser"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M4 12h3M17 12h3"/></svg></span><span class="lb"></span></button><button id="abil" class="hidden" aria-label="Faction ability"><svg viewBox="0 0 60 60"><circle class="tr" cx="30" cy="30" r="26"/><circle class="pr" cx="30" cy="30" r="26"/></svg><span class="ic"></span><span class="lb"></span></button></div>
    <div id="side"><div id="panel"></div><nav id="tabs"></nav></div>
  </div>
</div>
<div id="modal" class="hidden"><div class="box"></div></div>
<div id="mg" class="hidden"><canvas id="mgc"></canvas><div id="mghud"><button id="mgx" class="btn ghost" aria-label="Exit mission"><span class="l">✕ Exit</span></button><div id="mgt"></div><div id="mgs"></div></div><div id="mgres" class="hidden"></div></div>
<script>
(function(){
'use strict';
/* ================= constants & utils ================= */
const SAVE_KEY='planetHarvester.save.v1', VERSION=1, MAXV=1e300;
const RES=['ore','crystal','gas','exotic'];
const RINFO={ore:{n:'Ore',c:'#e7a85f'},crystal:{n:'Crystal',c:'#63d6ff'},gas:{n:'Gas',c:'#86f59a'},exotic:{n:'Exotic',c:'#ff66de'}};
const pw=Math.pow, TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-pw(-2*k+2,2)/2;
const safe=v=>Number.isNaN(v)?0:(v===Infinity||v>MAXV)?MAXV:(v<0?0:v);
const hsl=(h,s,l,a)=>`hsla(${h},${s}%,${l}%,${a==null?1:a})`;
const SUF=['','K','M','B','T'];
function fmt(n){
  if(n==null||Number.isNaN(n))return '0';
  if(!Number.isFinite(n))return n>0?'∞':'-∞';
  if(n<0)return '-'+fmt(-n);
  if(n<1000){ if(n>=100)return Math.floor(n)+''; if(n>=10)return (Math.floor(n*10)/10)+''; return (Math.floor(n*100)/100)+''; }
  let e=Math.floor(Math.log10(n)/3), m=n/pw(1000,e);
  if(m>=999.995){e++;m/=1000;}
  let s; if(e<SUF.length)s=SUF[e]; else {const i=e-SUF.length; s=String.fromCharCode(97+Math.floor(i/26)%26)+String.fromCharCode(97+i%26);}
  return (m<10?m.toFixed(2):m<100?m.toFixed(1):Math.floor(m))+s;
}
function fmtClock(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function fmtTime(s){ s=Math.max(0,Math.floor(s)); if(s<60)return s+'s'; if(s<3600)return Math.floor(s/60)+'m '+(s%60)+'s'; if(s<86400)return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'; return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'; }
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(a,b){let h=(Math.imul(a|0,0x9e3779b1)^Math.imul((b|0)+0x7f4a7c15,0x85ebca6b))>>>0;h^=h>>>13;h=Math.imul(h,0xc2b2ae35)>>>0;h^=h>>>16;return h>>>0;}
const SYL=['ka','ze','ri','tho','vel','mar','qu','an','dor','sy','lo','ne','pha','tur','xi','ber','cor','ul','ma','tes','vor','ix','el','os','ra','gen'];
function pname(r){let s='';const n=2+(r()<.35?1:0);for(let i=0;i<n;i++)s+=SYL[Math.floor(r()*SYL.length)];s=s[0].toUpperCase()+s.slice(1);if(r()<.35)s+=' '+['Prime','II','III','IV','Major','Minor','b','c'][Math.floor(r()*8)];return s;}

/* ================= world generation ================= */
const TYPES={
  rocky:{label:'Rocky',w:{ore:.72,crystal:.16,gas:.12},hues:[22,32,40,12]},
  ice:{label:'Ice World',w:{ore:.24,crystal:.62,gas:.14},hues:[190,200,212]},
  gas:{label:'Gas Giant',w:{ore:.08,crystal:.12,gas:.8},hues:[30,280,160,330,45]},
  lava:{label:'Volcanic',w:{ore:.55,crystal:.33,gas:.12},hues:[8,16]},
  exotic:{label:'Exotic',w:{ore:.18,crystal:.18,gas:.18,exotic:.46},hues:[300,275,320]}
};
const GAL_SUFFIX=['Nebula','Expanse','Reach','Cluster','Spiral','Drift','Veil'];
function genGalaxy(seed,g){
  /* v12: +2 planets appended after the v11 nBase sequence so existing saves keep planet indices */
  const r=mulberry(hash(seed,g+1));
  const nBase=6+Math.min(g,4),nExtra=2,n=nBase+nExtra;
  const pts=[{x:.5,y:.52}];
  for(let i=1;i<n;i++){let best=null,bd=-1;for(let k=0;k<60;k++){const c={x:.08+r()*.84,y:.1+r()*.8};let md=9;for(const p of pts)md=Math.min(md,Math.hypot(p.x-c.x,p.y-c.y));if(md>bd){bd=md;best=c;}if(md>.26)break;}pts.push(best);}
  const pool=g>=1?['rocky','ice','gas','lava','exotic']:['rocky','ice','gas','lava'];
  const types=['rocky'];for(let i=1;i<nBase;i++)types.push(pool[Math.floor(r()*pool.length)]);
  if(!types.includes('ice'))types[1]='ice'; if(!types.includes('gas'))types[2]='gas'; if(g>=1&&!types.includes('exotic'))types[nBase-1]='exotic';
  for(let i=nBase;i<n;i++)types.push(pool[Math.floor(r()*pool.length)]);
  const planets=[];
  for(let i=0;i<n;i++){
    const t=types[i],T=TYPES[t];const d=Math.hypot(pts[i].x-pts[0].x,pts[i].y-pts[0].y);
    const w={ore:0,crystal:0,gas:0,exotic:0,...T.w};
    if(i===0)Object.assign(w,{ore:.7,crystal:.15,gas:.15,exotic:0});
    if(g>=2&&t!=='exotic')w.exotic=.03*Math.min(g-1,6);
    let sum=0;for(const k of RES)sum+=w[k];for(const k of RES)w[k]/=sum;
    planets.push({i,name:(i===0&&g===0)?'Terra Nova':pname(r),type:t,x:pts[i].x,y:pts[i].y,dist:d,
      rich:i===0?1:(.85+r()*.4)*(1+d*2.2),cf:i===0?1:1+d*2.5,w,hue:T.hues[Math.floor(r()*T.hues.length)]+Math.floor(r()*14-7),
      size:i===0?1:.82+r()*.36,seed:Math.floor(r()*1e9),rings:t==='gas'&&r()<.7});
  }
  const gname=g===0?'Local Cluster':pname(r)+' '+GAL_SUFFIX[Math.floor(r()*GAL_SUFFIX.length)];
  return {planets,name:gname,hue:g===0?232:Math.floor(r()*360)};
}

/* ================= state ================= */
let S,P,GAL;
function newState(){

  return {v:VERSION,seed:(Math.random()*4294967296)>>>0,galaxy:0,res:{ore:0,crystal:0,gas:0,exotic:0,salvage:0},combat:{cannon:0,fighters:0,weapons:0,hull:0,shields:0,armaments:0,critChance:0,critPower:0},sound:true,haptics:true,autobuy:false,fullscreen:false,tips:{},lastVer:7,colony:newColony(),raids:0,father:{},trophies:{},faction:newFaction(),moon:null,
    mods:{drill:0,drones:0,laser:0,engine:0,super:0},laserCharge:0,at:0,travel:null,outposts:{},clock:now,saved:now,created:now,buyMode:1,
    stats:{taps:0,trips:0,rocks:0,built:0,earned:{ore:0,crystal:0,gas:0,exotic:0},play:0},ach:{},seenAch:0,intro:false};
}
function sanitizeMoon(o){if(!o||typeof o!=='object'||!o.owned)return null;return o;}
function sanitize(o){
  const d=newState();
  if(!o||typeof o!=='object'||!o.res||!o.mods)throw new Error('bad save');
  const s={...d,...o};
  s.res={...d.res};for(const k of [...RES,'salvage'])s.res[k]=safe(+o.res[k]||0);
  s.combat={...d.combat};for(const k in d.combat)s.combat[k]=Math.max(0,Math.floor(+((o.combat||{})[k])||0));
  s.raids=Math.max(0,Math.floor(+o.raids||0));s.lastVer=+o.lastVer||5;s.tips=(o.tips&&typeof o.tips==='object')?o.tips:{};s.sound=o.sound!==false;s.haptics=o.haptics!==false;s.autobuy=!!o.autobuy;s.fullscreen=o.fullscreen===true;if(!o.combat&&s.galaxy>=1){s.res.salvage+=Math.round(400*pw(1.6,s.galaxy));s.defenseGrant=true;}s.father=(o.father&&typeof o.father==='object')?o.father:{};s.trophies=(o.trophies&&typeof o.trophies==='object')?o.trophies:{};
  s.mods={...d.mods};for(const k in d.mods)s.mods[k]=Math.max(0,Math.floor(+o.mods[k]||0));
  s.stats={...d.stats,...(o.stats||{})};s.stats.earned={...d.stats.earned,...((o.stats||{}).earned||{})};
  s.galaxy=Math.max(0,Math.floor(+o.galaxy||0));s.seed=(+o.seed>>>0)||d.seed;
  s.outposts={};for(const k in (o.outposts||{})){const q=o.outposts[k];if(!q)continue;const st={ore:0,crystal:0,gas:0,exotic:0};for(const r of RES)st[r]=safe(+((q.s||{})[r])||0);s.outposts[k]={lvl:Math.max(1,Math.floor(+q.lvl||1)),sto:Math.max(0,Math.floor(+q.sto||0)),tur:Math.max(0,Math.floor(+q.tur||0)),s:st};}
  s.clock=Number.isFinite(+o.clock)?+o.clock:Date.now();s.laserCharge=Math.max(0,+o.laserCharge||0);if(s.galaxy<1)s.mods.super=0;
  s.ach=o.ach&&typeof o.ach==='object'?o.ach:{};s.colony=sanitizeColony(o.colony);
  if(![1,10,'max'].includes(s.buyMode))s.buyMode=1;
  if(s.travel&&!(Number.isFinite(s.travel.to)&&Number.isFinite(s.travel.start)))s.travel=null;
  s.faction=sanitizeFaction(o.faction); // v10: old saves load with no faction
  s.moon=sanitizeMoon(o.moon); // v11: Battle Moon
  return s;
}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;return sanitize(JSON.parse(raw));}catch(e){console.warn('save load failed',e);return null;}}
function save(){try{accrueOutposts(Date.now());S.saved=Date.now();S.fullscreen=!!R.fs;localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){console.warn('save failed',e);}}
function setWorld(){GAL=genGalaxy(S.seed,S.galaxy);P=GAL.planets;applyDiscoveries();if(S.at<0||S.at>=P.length)S.at=0;for(const k in S.outposts)if(!P[k])delete S.outposts[k];texCache.clear();nebula=null;}

/* ================= economy ================= */
const gRich=()=>pw(4,S.galaxy);
const gCost=()=>pw(5,S.galaxy);
const achCount=()=>Object.keys(S.ach).length;
const empire=()=>(1+S.galaxy)*(1+.03*achCount())*colonyMult();
let flareUntil=0;
const flareOn=()=>performance.now()<flareUntil;
function perDrone(){const d=S.mods.drill;return (1+.6*d)*pw(2,Math.floor(d/25));}
function droneCount(){return 1+S.mods.drones;}
function stationRate(pi){if(pi==null)pi=S.at;const p=P[pi];return safe(droneCount()*perDrone()*p.rich*gRich()*empire()*(flareOn()?3:1)*(dronesEngaged()?.5:1)*corpOut()*odStation());}
function tapAmt(){const L=S.mods.laser;return safe(((2+1.5*L)*pw(1.12,L)*gRich()*empire()+.1*stationRate())*odTap());}
function outRate(pi){const o=S.outposts[pi];if(!o)return 0;const p=P[pi];return safe(.5*o.lvl*pw(1.05,o.lvl-1)*p.rich*gRich()*empire()*corpOut());}
function capSec(o){return 1800*pw(1.5,o.sto)*(1+.1*perk('store'));}
function outCap(pi){const o=S.outposts[pi];return o?safe(outRate(pi)*capSec(o)):0;}
function stored(o){let t=0;for(const k of RES)t+=o.s[k];return t;}
const cc=o=>{const r={};for(const k in o)if(o[k]>0)r[k]=safe(o[k]<1e15?Math.ceil(o[k]):o[k]);return r;};
const MODS={
  drill:{name:'Drill Power',desc:'Every drone mines harder',cost:L=>cc({ore:15*pw(1.25,L),crystal:L>=3?4*pw(1.27,L):0}),
    eff:()=>'Each drone: '+fmt(perDrone()*P[S.at].rich*gRich()*empire())+'/s here',
    svg:'<path d="M12 3v10M8 9l4 4 4-4M6 21h12M9 17h6"/>'},
  drones:{name:'Drone Bay',desc:'+1 mining drone per level',cost:L=>cc({ore:50*pw(1.55,L),gas:12*pw(1.55,L)}),
    eff:()=>droneCount()+' drone'+(droneCount()>1?'s':'')+' active',
    svg:'<path d="M12 5l6 10H6z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>'},
  laser:{name:'Tap Laser',desc:'Stronger manual mining taps',cost:L=>cc({ore:20*pw(1.4,L),crystal:6*pw(1.4,L)}),
    eff:()=>'+'+fmt(tapAmt())+' per tap',
    svg:'<path d="M4 20l7-7M13 11l7-7M14 4h6v6"/><circle cx="11" cy="13" r="2"/>'},
  engine:{name:'Warp Engine',desc:'Faster, cheaper planet travel',cost:L=>cc({gas:25*pw(1.45,L),crystal:15*pw(1.45,L)}),
    eff:()=>'Travel speed ×'+(1+.2*S.mods.engine).toFixed(1)+' · fuel use −'+Math.round(100-100/(1+.1*S.mods.engine))+'%',
    svg:'<path d="M12 3c3 3 4 7 3 11h-6c-1-4 0-8 3-11z"/><path d="M9 14l-2 4h10l-2-4M12 18v3"/>'},
  super:{name:'Super Laser',desc:'Charge up, then blast the planet for a huge haul',locked:()=>S.galaxy<1,
    cost:L=>cc({exotic:SUPER_EX*pw(2.2,L)*pw(30,Math.max(0,S.galaxy-1)),crystal:SUPER_CR*pw(2.2,L)*pw(30,Math.max(0,S.galaxy-1))}),
    eff:()=>S.mods.super<1?'Exotic-fuelled blasts worth 12 min of output. Fire by tapping your station.':'Shot cost: <b style="color:#ff9cf0">'+fmt(shotCost())+' exotic</b> · Payout: '+Math.round(shotSec()/60)+' min · Recharge: '+fmtClock(chargeTime())+'<br>Tap the station when its ring is full',
    svg:'<circle cx="7" cy="17" r="3"/><path d="M9 15L20 4M15 4h5v5M12 18l2 2M4 10l2 2"/>'}
};
/* v10 Mega Corp: cheaper station modules (not the exotic Super Laser) */
for(const k of ['drill','drones','laser','engine']){const f0=MODS[k].cost;MODS[k].cost=L=>discCost(f0(L));}
/* Super Laser: galaxy 2+ only. Charges only while the game is open (like the station). */
const SUPER_EX=2.5e7,SUPER_CR=2e7;
function chargeTime(){return Math.max(15,120/(1+.2*(S.mods.super-1))/(1+.08*perk('laser')));}
function shotSec(){return 720*(1+.5*(Math.max(1,S.mods.super)-1));}
/* station power at richness 1 (no flare): grows with all station upgrades, galaxy richness and empire bonus */
function stationPower(){return droneCount()*perDrone()*gRich()*empire();}
/* per-shot exotic fuel: 60s of station power, 10% cheaper per extra laser level, with a galaxy-scaled floor */
function shotCost(){return safe(Math.ceil(Math.max(5e4*pw(30,Math.max(0,S.galaxy-1)),60*stationPower())*pw(.9,Math.max(1,S.mods.super)-1)));}
const shotAffordable=()=>S.res.exotic>=shotCost();
function shotWeights(){const w={...P[S.at].w};w.exotic=0;let s=0;for(const k of RES)s+=w[k];for(const k of RES)w[k]=s>0?w[k]/s:0;return w;}
const laserOwned=()=>S.galaxy>=1&&S.mods.super>0;
const laserReady=()=>laserOwned()&&S.laserCharge>=chargeTime();
function fireLaser(){if(!laserReady()||S.travel)return;const fuel=shotCost();if(!(S.res.exotic>=fuel)){toast('Need '+fmt(fuel)+' exotic to fire','');return;}S.res.exotic=safe(S.res.exotic-fuel);S.laserCharge=0;S.stats.shots=(S.stats.shots||0)+1;if(inCombat()){combatLaser();vib([20,40,60]);return;}let amt=stationRate()*shotSec();const lc=Math.random()<critChance()*.5;if(lc)amt*=critMult();addSplit(amt,shotWeights());sfx('laser');if(lc&&R.geo)critFx(R.geo.cx,R.geo.cy,amt,'+'+fmt(amt));S.stats.shots=(S.stats.shots||0)+1;R.laserFx=1.3;
  if(R.geo){burst(R.geo.cx,R.geo.cy,70,(()=>{const g={};const w=shotWeights();for(const k of RES)if(w[k]>0)g[k]=1;return g;})());floatText(R.geo.cx,R.geo.cy+R.geo.R+26,'SUPER LASER +'+fmt(amt),'#ff9cf0');}
  vib([20,40,60]);checkAch();}
function costAdd(a,b){const o={...a};for(const k in b)o[k]=(o[k]||0)+b[k];return o;}
function canAfford(c){for(const k in c)if(c[k]>0&&!(S.res[k]>=c[k]))return false;return true;}
function pay(c){for(const k in c)if(c[k]>0)S.res[k]=safe(S.res[k]-c[k]);}
function bulk(fn,L,mode){
  mode=mode||S.buyMode;
  if(mode==='max'){let tot={},n=0;for(;n<1000;n++){const t2=costAdd(tot,fn(L+n));if(!canAfford(t2))break;tot=t2;}return n===0?{n:1,c:fn(L)}:{n,c:tot};}
  let tot={};for(let i=0;i<mode;i++)tot=costAdd(tot,fn(L+i));return {n:mode,c:tot};
}
function addRes(k,a){a=safe(a);if(a<=0)return;S.res[k]=safe(S.res[k]+a);S.stats.earned[k]=safe((S.stats.earned[k]||0)+a);}
function addSplit(total,w){for(const k of RES)if(w[k]>0)addRes(k,total*w[k]);}

/* outposts */
const outCount=()=>Object.keys(S.outposts).length;
function buildCost(pi){const k=gCost()*P[pi].cf*pw(1.8,outCount());return cc({ore:200*k,crystal:50*k});}
function lvlCost(pi,L){const k=gCost()*P[pi].cf;return discCost(cc({ore:60*pw(1.45,L)*k,crystal:18*pw(1.45,L)*k,gas:L>=2?10*pw(1.45,L)*k:0}));}
function stoCost(pi,L){const k=gCost()*P[pi].cf;return discCost(cc({ore:80*pw(1.6,L)*k,gas:25*pw(1.6,L)*k}));}
/* The single source of truth for outpost production: used every frame AND for offline time. */
function accrueOutposts(now){
  let dt=(now-S.clock)/1000;
  if(!Number.isFinite(dt)||dt<0){S.clock=now;return;}
  if(dt===0)return;
  S.clock=now;
  for(const pi in S.outposts){
    const o=S.outposts[pi],rate=outRate(pi),cap=rate*capSec(o),cur=stored(o);
    const add=Math.min(rate*dt,Math.max(0,cap-cur));
    if(add>0){const w=P[pi].w;for(const k of RES)if(w[k]>0)o.s[k]=safe(o.s[k]+add*w[k]);}
  }
}
function snapshot(){const m={};for(const pi in S.outposts)m[pi]={...S.outposts[pi].s};return m;}
function diffSnap(snap){const out=[];for(const pi in S.outposts){const o=S.outposts[pi],b=snap[pi]||{};const g={};let any=0;for(const k of RES){g[k]=Math.max(0,o.s[k]-(b[k]||0));any+=g[k];}out.push({pi:+pi,g,any,full:stored(o)>=outCap(pi)*.999});}return out;}
function collect(pi,quiet){
  const o=S.outposts[pi];if(!o)return null;accrueOutposts(Date.now());
  const got={};let tot=0;for(const k of RES){if(o.s[k]>0){got[k]=o.s[k];tot+=o.s[k];addRes(k,o.s[k]);o.s[k]=0;}}
  if(tot>0&&!quiet){addRep('corp',4);sfx('coin');toast('Collected '+Object.keys(got).map(k=>fmt(got[k])+' '+RINFO[k].n.toLowerCase()).join(', '),'good');if(R.geo)burst(R.geo.ox,R.geo.oy,24,got);}
  return tot>0?got:null;
}
function buildOutpost(){
  const pi=S.at;if(S.travel||S.outposts[pi])return;const c=buildCost(pi);if(!canAfford(c))return;
  accrueOutposts(Date.now());pay(c);S.outposts[pi]={lvl:1,sto:0,tur:0,s:{ore:0,crystal:0,gas:0,exotic:0}};S.stats.built++;
  toast('Outpost established on '+P[pi].name+'!','gold');checkAch();save();renderPanel();
}
function upOutpost(pi){const o=S.outposts[pi];if(!o)return;const b=bulk(L=>lvlCost(pi,L),o.lvl);if(!canAfford(b.c))return;accrueOutposts(Date.now());pay(b.c);o.lvl+=b.n;addRep('corp',1);checkAch();}
function upStorage(pi){const o=S.outposts[pi];if(!o)return;const c=stoCost(pi,o.sto);if(!canAfford(c))return;accrueOutposts(Date.now());pay(c);o.sto++;}
function buyMod(k){if(MODS[k].locked&&MODS[k].locked())return;const L=S.mods[k];const b=bulk(MODS[k].cost,L);if(!canAfford(b.c))return;pay(b.c);S.mods[k]+=b.n;addRep('corp',1);checkAch();}

/* travel */
const pdist=(a,b)=>Math.hypot(P[a].x-P[b].x,P[a].y-P[b].y);
function travelCost(to,instant){return cc({gas:6*(1+pdist(S.at,to)*10)*gRich()/(1+.1*S.mods.engine)*(instant?3:1)});}
function travelTime(to){return (2+pdist(S.at,to)*25)/(1+.2*S.mods.engine)/(1+.1*perk('travel'))/travelK();}
function startTravel(to,instant){
  if(S.travel||to===S.at||!P[to])return;if(C.father){toast('You cannot flee the Father Ship!','');return;}const c=travelCost(to,instant);if(!canAfford(c)){toast('Not enough gas for that trip','');return;}
  pay(c);if(C.raid){C.raid=null;for(const e of C.enemies)e.state='flee';}
  if(instant){S.at=to;arrive(true);return;}
  S.travel={from:S.at,to,start:Date.now(),dur:travelTime(to)*1000};parts.length=0;rocks.length=0;
  if(R.tab==='map'){}renderPanel();save();
}
function updateTravel(now){if(S.travel&&now>=S.travel.start+S.travel.dur){S.at=S.travel.to;S.travel=null;arrive(false);}}
function arrive(instant){
  S.stats.trips++;R.sel=null;parts.length=0;
  if(instant)R.warpFlash=1;
  toast('Arrived at '+P[S.at].name,'');
  if(S.outposts[S.at])setTimeout(()=>collect(S.at),350);
  if(C.oraid&&C.oraid.pi===S.at&&!C.father)setTimeout(launchORaid,700);
  explorerArrive();checkAch();renderPanel();save();
}

/* galaxy */
function jumpCost(){const g=S.galaxy,k=pw(30,g);const c={ore:1e6*k,crystal:2.5e5*k,gas:2.5e5*k};if(g>=1)c.exotic=2e3*pw(30,g-1);return cc(c);}
function jumpGalaxy(){

}

/* achievements */

/* ================= outpost raids: live (map countdown) + offline (capped) ================= */
const RAID_PER_HOUR=.5,RAID_MAX_FRAC=.10,ABSENCE_MAX_FRAC=.20,ORAID_TIME=90;
function outDefense(pi){const o=S.outposts[pi];if(!o)return 0;const t=o.tur||0;return (6+14*t*pw(1.12,t)+maxShield()/25)*eScale()*(1+.1*perk('def'));}
function pirateStrength(){return 8*eScale()*(1+.25*S.galaxy)*(S.galaxy>=1?1.6*1.15:1.3);}
function repelChance(pi){const D=outDefense(pi),p=pirateStrength();return D/(D+p);}
function turCost(pi,L){return cc({salvage:6*pw(1.38,L)*eScale(),ore:80*pw(1.5,L)*gCost()*P[pi].cf});}
function buyTurret(pi){const o=S.outposts[pi];if(!o)return;const b=bulk(L=>turCost(pi,L),o.tur||0);if(!canAfford(b.c))return;pay(b.c);o.tur=(o.tur||0)+b.n;}
/* One raid on an outpost. Steals only STORED resources (never levels), max 10% of storage per raid; optional absence budget. */
function resolveRaid(pi,budget){
  const o=S.outposts[pi];if(!o)return null;const D=outDefense(pi),ps=pirateStrength()*(.6+Math.random()*.8);
  if(Math.random()*(D+ps)<D){const sal=Math.max(1,Math.round(2*eScale()));addRes('salvage',sal);return {won:true,salvage:sal,frac:0,lost:{}};}
  const frac=Math.min(RAID_MAX_FRAC,.12*ps/(D+ps)*(S.galaxy===0?.5:1));
  const st=stored(o);let take=st*frac;if(budget)take=Math.min(take,Math.max(0,budget.left));if(budget)budget.left-=take;
  const lost={};if(st>0&&take>0){const r=take/st;for(const k of RES){const a=o.s[k]*r;if(a>0){o.s[k]=safe(o.s[k]-a);lost[k]=a;}}}
  return {won:false,lost,frac:st>0?take/st:0,salvage:0};
}
/* Offline: each outpost rolls a 50% raid chance per hour away (max 48h). Total loss per outpost per absence <= 20% of its storage. */
function offlineRaids(secs){
  const rep={};if(!(secs>=600))return rep;const hours=Math.min(48,secs/3600),full=Math.floor(hours);
  for(const pi in S.outposts){const o=S.outposts[pi],base=stored(o),budget={left:base*ABSENCE_MAX_FRAC};
    const rph=RAID_PER_HOUR*pirateOffline();let n=0;for(let h=0;h<full;h++)if(Math.random()<rph)n++;if(Math.random()<(hours-full)*rph)n++;
    if(!n)continue;const r={raids:n,repelled:0,salvage:0,lost:{},lostTotal:0,base,maxFrac:0};
    for(let i=0;i<n;i++){const x=resolveRaid(pi,budget);if(x.won){r.repelled++;r.salvage+=x.salvage;}else{r.maxFrac=Math.max(r.maxFrac,x.frac);for(const k in x.lost){r.lost[k]=(r.lost[k]||0)+x.lost[k];r.lostTotal+=x.lost[k];}}}
    rep[pi]=r;}
  return rep;
}

/* simulation: used live (rate 1) and offline (rate COLONY_OFFLINE_RATE) */
function colonyStep(dt,rate,oreFloor){const c=CO();if(!c.on)return {pop:0,rp:0,refIn:0,refOut:0,ships:0};const d=dt*rate,r={pop:0,rp:0,refIn:0,refOut:0,ships:0};
  const g=popGrowth()*d,p0=c.pop;c.pop=Math.min(popCap(),c.pop+g);if(c.pop<p0)c.pop=p0;r.pop=c.pop-p0;c.born+=r.pop;
  const rp=rpRate()*d;c.rp+=rp;c.rpTotal+=rp;r.rp=rp;
  if(c.refOut!=='off'&&colLv('ref')>0&&!(c.refOut==='exotic'&&S.galaxy<1)){const use=Math.min(Math.max(0,S.res.ore-(oreFloor||0)),refThroughput()*d);if(use>0){S.res.ore=safe(S.res.ore-use);const o=use*REF_RATIO[c.refOut];addRes(c.refOut,o);c.refined+=use;r.refIn=use;r.refOut=o;r.refK=c.refOut;}}
  if(colLv('yard')>0&&c.ships<shipCap()){c.yt+=d;const T=shipTime();while(c.yt>=T&&c.ships<shipCap()){c.yt-=T;c.ships++;r.ships++;}}else c.yt=0;
  // trade allowances refill over real time (one full refill per hour)
  if(c.tv<0)c.tv=tvMax();c.tv=Math.min(tvMax(),c.tv+tvMax()*dt/3600);if(c.exq<0)c.exq=exqMax();c.exq=Math.min(exqMax(),c.exq+exqMax()*dt/3600);
  return r;}
function colonyOffline(sec){if(!CO().on||!(sec>0))return null;sec=Math.min(sec,48*3600);const tot={pop:0,rp:0,refIn:0,refOut:0,ships:0,refK:null,sec};
  const n=Math.ceil(sec/Math.max(10,sec/3000)),st=sec/n,floor=S.res.ore*.5;/* offline refining never uses more than half the ore you left with */for(let i=0;i<n;i++){const r=colonyStep(st,COLONY_OFFLINE_RATE,floor);tot.pop+=r.pop;tot.rp+=r.rp;tot.refIn+=r.refIn;tot.refOut+=r.refOut;tot.ships+=r.ships;if(r.refK)tot.refK=r.refK;}
  return (tot.pop>=.5||tot.rp>=.5||tot.refIn>0||tot.ships>0)?tot:null;}
function colonyLine(cg){if(!cg)return '';const L=[];if(cg.pop>=.5)L.push('+'+fmt(Math.floor(cg.pop))+' colonists');if(cg.rp>=.5)L.push('+'+fmt(Math.floor(cg.rp))+' research');if(cg.refIn>0)L.push('refined '+fmt(cg.refIn)+' ore → '+fmt(cg.refOut)+' '+RINFO[cg.refK].n.toLowerCase());if(cg.ships)L.push('+'+cg.ships+' fighter'+(cg.ships>1?'s':''));
  return `<div class="gain"><div><b>Colony</b><div class="muted">(offline: half speed)</div></div><div class="costs" style="flex-direction:column;align-items:flex-end;font-size:12px">${L.map(x=>`<span>${x}</span>`).join('')}</div></div>`;}

const tierOf=L=>L>=25?4:L>=10?3:L>=5?2:L>=1?1:0;
function colonyViewOn(){return R.tab==='colony'&&!S.travel&&!inCombat()&&CO().on;}
function deckGeo(){const s=Math.min(W,H*1.05),ox=(W-s)/2,oy=(H-s*.95)/2;return {s,ox,oy,P:(n)=>({x:ox+n.x*s,y:oy+n.y*s*.95})};}
function roomSize(k,g){const t=tierOf(colLv(k));return g.s*(k==='hub'?.12:.085+.018*t);}
function builtRooms(){return COL_IDS.filter(k=>colLv(k)>0);}
const JOBCOL={hab:'#7ad7ff',trade:'#ffd36b',lab:'#c9a4ff',ref:'#ff9f5a',yard:'#8dffb0'};
function newAgent(){const rooms=builtRooms();const home=rooms[Math.floor(Math.random()*rooms.length)]||'hab';const a={at:home,x:ROOMS[home].x,y:ROOMS[home].y,path:[],state:'inside',t:Math.random()*3,col:JOBCOL[home],carry:false,spd:.05+Math.random()*.035,ph:Math.random()*TAU};return a;}
function planAgent(a){const rooms=builtRooms();if(!rooms.length)return;let to;
  if(Math.random()<.25){a.path=[{...ROOMS.hub,ix:(Math.random()-.5)*.09,iy:(Math.random()-.5)*.07}];a.dest='idle';}
  else{to=rooms[Math.floor(Math.random()*rooms.length)];if(to===a.at&&rooms.length>1)to=rooms[(rooms.indexOf(to)+1)%rooms.length];
    a.carry=(a.at==='ref'||a.at==='yard')&&to==='trade'||(a.at==='trade'&&Math.random()<.5);a.path=[{...ROOMS.hub,ix:(Math.random()-.5)*.05,iy:(Math.random()-.5)*.05},{...ROOMS[to],ix:0,iy:0}];a.dest=to;}
  a.state='walk';}
function updateAgents(dt){const want=Math.min(60,Math.floor(CO().pop));const A=COLV.agents;
  while(A.length<want)A.push(newAgent());if(A.length>want)A.length=want;
  for(const a of A){a.ph+=dt*9;
    if(a.state==='inside'||a.state==='idle'){a.t-=dt;if(a.t<=0)planAgent(a);continue;}
    const n=a.path[0];if(!n){a.state='idle';a.t=1;continue;}const tx=n.x+(n.ix||0),ty=n.y+(n.iy||0);const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy),st=a.spd*dt;
    if(d<=st){a.x=tx;a.y=ty;a.path.shift();if(!a.path.length){if(a.dest==='idle'){a.state='idle';a.t=1+Math.random()*2.5;}else{a.at=a.dest;a.state='inside';a.t=2+Math.random()*4;a.carry=false;a.col=JOBCOL[a.at];}}}
    else{a.x+=dx/d*st;a.y+=dy/d*st;}}}

      ctx.strokeStyle=`rgba(255,180,110,${.5+.4*Math.sin(t*6)})`;ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.lineDashOffset=-t*18;ctx.beginPath();ctx.moveTo(-(n-1)/2*R0*sp,0);ctx.lineTo((n-1)/2*R0*sp,0);ctx.stroke();ctx.setLineDash([]);}

  ctx.font='800 11px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.75)';const lb=M.name+' · '+L;ctx.strokeText(lb,c.x,c.y+r*.8+13);ctx.fillStyle='#e8ecff';ctx.fillText(lb,c.x,c.y+r*.8+13);}

function colonyTap(x,y){const g=deckGeo();let best=null,bd=1e9;for(const k of ['hub',...COL_IDS]){const p=g.P(ROOMS[k]),r=Math.max(34,roomSize(k,g)*1.1),d=Math.hypot(p.x-x,p.y-y);if(d<r&&d<bd){bd=d;best=k;}}

const COL_SVG={hab:'<path d="M4 20V11l8-6 8 6v9z"/><path d="M10 20v-5h4v5"/>',trade:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',lab:'<path d="M9 3h6M10 3v6l-5 10h14L14 9V3"/>',ref:'<rect x="4" y="8" width="6" height="12" rx="2"/><rect x="14" y="5" width="6" height="15" rx="2"/><path d="M10 14h4"/>',yard:'<path d="M3 20h18M6 20V8l6-4 6 4v12M9 12h6"/>'};

function moonLaserReady(){return moonOwned()&&!S.moon.travel&&S.moon.laserCharge>=moonLaserChargeTime()&&S.res.exotic>=moonLaserCost();}
function moonMoveTime(from,to){const base=travelTime(to)*(from===to?0:1);/* travelTime uses S.at — recompute */const d=pdist(from,to);
  return Math.max(2,(2+d*25)*.32/(1+.2*S.mods.engine)/(1+.1*perk('travel'))/travelK()/(1+.18*moonLv('move')));}
function moonAtPlanet(){return moonOwned()&&!S.moon.travel?S.moon.at:-1;}
function moonDefending(){return moonAtPlanet()===S.at&&!S.travel&&inCombat()&&!(C.father&&(C.father.warn>0||C.father.end));}
function buyMoon(){if(moonOwned()||!moonUnlocked())return false;const c=moonBuyCost();if(!canAfford(c))return false;pay(c);
  S.moon=newMoon();S.moon.owned=true;S.moon.buys=1;S.moon.at=S.at;S.moon.hp=moonMaxHp();S.moon.laserCharge=0;
  toast('Battle Moon constructed and parked at '+P[S.at].name+'!','gold');sfx('coin');vib([20,40,20]);C.shake=Math.max(C.shake,6);save();renderPanel();return true;}
function buyMoonUp(k){if(!moonOwned()||!MOON_META[k])return false;const L=moonLv(k);if(L>=12)return false;const b=bulk(L2=>moonUpCost(k,L2),L);if(!canAfford(b.c))return false;pay(b.c);
  S.moon.ups[k]=L+b.n;if(k==='hull')S.moon.hp=Math.min(moonMaxHp(),(S.moon.hp||0)+moonMaxHp()*.2);sfx('coin');save();return true;}
function startMoonMove(to){if(!moonOwned()||S.moon.travel||to==null||!P[to])return false;
  if(!(S.outposts[to]||to===S.at)){toast('Battle Moon can only park at owned outposts','');return false;}
  if(to===S.moon.at){toast('Battle Moon is already there','');return false;}
  const dur=moonMoveTime(S.moon.at,to)*1000;S.moon.travel={from:S.moon.at,to,start:Date.now(),dur};toast('Battle Moon en route to '+P[to].name+' ('+fmtTime(Math.ceil(dur/1000))+')','gold');sfx('zap');save();if(R.tab==='station'||R.tab==='map'||R.tab==='outposts')renderPanel();return true;}
function updateMoonTravel(){const m=moon();if(!m||!m.travel)return;if(Date.now()>=m.travel.start+m.travel.dur){m.at=m.travel.to;m.travel=null;m.hp=Math.min(moonMaxHp(),m.hp||moonMaxHp());
  toast('Battle Moon arrived at '+P[m.at].name,'good');sfx('coin');save();if(R.tab==='station'||R.tab==='map'||R.tab==='outposts')renderPanel();}}
function moonOnJump(){if(!moonOwned())return;S.moon.travel=null;S.moon.at=0;S.moon.hp=moonMaxHp();}

function armadaMothers(){return 2+Math.min(2,S.galaxy);}
function shouldEscalateArmada(){if(S.galaxy<1||C.armadaWarn>0||C.raid||C.father||S.travel)return false;const p=Math.min(.18,.10+.02*S.galaxy);return Math.random()<p;}
function startArmadaWarning(){if(C.raid||C.father||C.armadaWarn>0)return;C.armadaWarn=22;sfx('alarm');setTimeout(()=>sfx('alarm'),600);setTimeout(()=>sfx('alarm'),1200);
  toast('ARMADA INCOMING — reposition the Battle Moon & charge lasers!','gold');vib([40,40,80,40,80]);C.shake=Math.max(C.shake,5);updateBadges();if(R.tab==='map'||R.tab==='outposts'||R.tab==='station')renderPanel();}
function startArmada(){if(C.raid||C.father||S.travel)return;C.armadaWarn=0;S.raids=(S.raids||0)+1;const n=armadaSize(),ms=armadaMothers();
  const q=[];for(let i=0;i<n;i++)q.push(pickType());
  C.raid={queue:q,spawnT:0,time:0,mother:true,kills:0,size:q.length+ms,hunters:false,armada:true,spawnBatch:4,spawnGap:.35};
  for(let i=0;i<ms;i++){const e=spawnEnemy('mothership',W*(.15+.7*i/(ms-1||1)),-50-i*18);e.px=W*(.18+.64*i/(ms-1||1));e.py=H*(.12+.08*(i%2));}
  C.shield=maxShield();C.shake=Math.max(C.shake,8);toast('ARMADA HAS ARRIVED — '+n+' ships · '+ms+' motherships!','gold');sfx('alarm');logC('Armada inbound at '+P[S.at].name+': '+n+'+'+ms+' motherships');
  if(moonDefending()||(moonOwned()&&moonAtPlanet()===S.at)){S.moon.hp=S.moon.hp||moonMaxHp();}
  S.stats.armadas=(S.stats.armadas||0)+1;updateBadges();}
function armadaActive(){return !!(C.raid&&C.raid.armada);}

/* wrap startRaid for escalation + force flags */

/* Salvage Haul */
function spawnSalvageHaul(won){const n=won?10+Math.floor(Math.random()*5):4+Math.floor(Math.random()*3);const crates=[];
  for(let i=0;i<n;i++){const a=Math.random()*TAU,rr=Math.min(W,H)*(.18+.28*Math.random());
    crates.push({x:W/2+Math.cos(a)*rr,y:H*.42+Math.sin(a)*rr*.7,r:16+Math.random()*6,life:30,mul:won?1:.5,spin:Math.random()*TAU});}
  C.haul={crates,t:30,won};toast(won?'Wreckage drifting — tap crates for a Salvage Haul!':'Scattered wreckage — grab what you can','gold');}
function updateHaul(dt){const H0=C.haul;if(!H0)return;H0.t-=dt;for(const c of H0.crates){c.life-=dt;c.spin+=dt*1.2;c.y+=Math.sin(c.spin)*6*dt;c.x+=Math.cos(c.spin*.7)*4*dt;}
  H0.crates=H0.crates.filter(c=>c.life>0);if(H0.t<=0||!H0.crates.length){if(H0.crates.length){let sal=0;for(const c of H0.crates){const g=collectHaulCrate(c);sal+=g.sal;}toast('Leftover wreckage auto-salvaged (+'+fmt(sal)+')','good');}C.haul=null;}}
function collectHaulCrate(c){const U=stationPower(),sal=Math.round(18*eScale()*c.mul),amt=12*U*c.mul;addRes('salvage',sal);
  const w={...P[S.at].w};w.exotic=0;let s=0;for(const k of RES)s+=w[k]||0;for(const k of RES)if(s>0&&w[k]>0)addRes(k,amt*(w[k]/s));return {sal};}
function tapHaul(x,y){const H0=C.haul;if(!H0)return false;let best=null,bd=1e9;for(const c of H0.crates){const d=Math.hypot(c.x-x,c.y-y);if(d<Math.max(34,c.r*1.8)&&d<bd){bd=d;best=c;}}
  if(!best)return false;const U=stationPower(),sal=Math.round(18*eScale()*best.mul),amt=12*U*best.mul;
  addRes('salvage',sal);const w={...P[S.at].w};w.exotic=0;let s=0;for(const k of RES)s+=w[k]||0;for(const k of RES)if(s>0&&w[k]>0)addRes(k,amt*(w[k]/s));
  burst(best.x,best.y,18,{ore:1,salvage:1});floatText(best.x,best.y-10,'+'+fmt(sal)+' salvage','#c9d1e6');sfx('coin');vib(12);
  H0.crates.splice(H0.crates.indexOf(best),1);if(!H0.crates.length)C.haul=null;return true;}
function drawHaul(t){const H0=C.haul;if(!H0)return;for(const c of H0.crates){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.spin*.3);
  const g=ctx.createLinearGradient(-c.r,-c.r,c.r,c.r);g.addColorStop(0,'#c9d1e6');g.addColorStop(.5,'#6a738a');g.addColorStop(1,'#2a3040');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(c.r*.9,0);ctx.lineTo(c.r*.3,c.r*.7);ctx.lineTo(-c.r*.6,c.r*.5);ctx.lineTo(-c.r*.8,-c.r*.2);ctx.lineTo(-c.r*.1,-c.r*.75);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,220,140,.7)';ctx.lineWidth=1.5;ctx.stroke();ctx.globalCompositeOperation='lighter';glow('#ffd36b',0,0,c.r*.9,.35+.25*Math.sin(t*5+c.spin));ctx.globalCompositeOperation='source-over';
  ctx.restore();}
  ctx.font='bold 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#ffe3a3';ctx.fillText('SALVAGE HAUL · '+Math.ceil(H0.t)+'s · tap crates',W/2,H-36);}

/* Battle Moon combat */
function moonPos(){const g=R.geo;if(!g)return {x:W*.78,y:H*.22};return {x:g.cx+g.R*1.15,y:g.cy-g.R*.55};}
function updateMoonCombat(dt,t){if(!moonOwned())return;updateMoonTravel();
  /* charge Moon Laser */
  if(!document.hidden&&!S.moon.travel)S.moon.laserCharge=Math.min(moonLaserChargeTime(),S.moon.laserCharge+dt*(inCombat()?2:1));
  if(!moonDefending()){moonFireBtn(false);return;}
  const m=S.moon;if(!(m.hp>0))m.hp=moonMaxHp();
  /* regenerate slowly */
  m.hp=Math.min(moonMaxHp(),m.hp+moonMaxHp()*dt/90);
  const mp=moonPos(),targets=C.enemies.filter(e=>e.vis>.5&&e.state!=='flee');
  const nT=moonTurrets(),per=moonDps()/nT;
  for(let k=0;k<nT;k++){if(!targets.length)break;const e=targets[k%targets.length];
    /* soft fire packet */
    e._moonAcc=(e._moonAcc||0)+per*dt;if(e._moonAcc<per*.45)continue;const d=e._moonAcc;e._moonAcc=0;
    if(damageEnemy(e,d,false)){/* assist credit if dead */}
    if(!C.enemies.includes(e)){m.assists=(m.assists||0)+1;if(m.assists%25===0)toast('Battle Moon assist streak: '+m.assists,'gold');}
    else sfx('zap');}
  moonFireBtn(true);}
function moonPointDefense(shot){if(!moonDefending()||!(S.moon.hp>0))return false;if(shot.kind!=='station'&&shot.kind!=='outpost')return false;
  if(Math.random()>moonPdChance())return false;burst(shot.x,shot.y,5,{gas:1});floatText(shot.x,shot.y-8,'PD','#9fe6ff');return true;}
function fireMoonLaser(){if(!moonLaserReady()||S.travel)return false;const fuel=moonLaserCost();S.res.exotic=safe(S.res.exotic-fuel);S.moon.laserCharge=0;
  const d=moonLaserDmg();const mp=moonPos();sfx('laser');vib([25,40,70]);C.shake=Math.max(C.shake,14);R.moonLaserFx=1.1;R.moonLaserFrom={x:mp.x,y:mp.y};
  let tg=C.enemies.filter(e=>e.type==='mothership'&&e.state!=='flee').sort((a,b)=>b.hp-a.hp)[0];
  if(!tg){/* densest cluster: pick enemy with most neighbors */
    let best=null,bs=-1;for(const e of C.enemies){if(e.vis<.5||e.state==='flee')continue;let n=0;for(const o of C.enemies)if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<e.r*4)n++;if(n>bs){bs=n;best=e;}}tg=best;}
  if(tg){R.moonLaserTo={x:tg.x,y:tg.y};damageEnemy(tg,d,true);const rad=Math.max(60,tg.r*3.5);
    for(const e of [...C.enemies]){if(e===tg||e.state==='flee')continue;if(Math.hypot(e.x-tg.x,e.y-tg.y)<rad)damageEnemy(e,d*.3,false);}
    floatText(tg.x,tg.y-tg.r-12,'MOON LASER -'+fmt(d),'#b8f0ff');}
  else{R.moonLaserTo={x:W/2,y:H*.3};floatText(mp.x,mp.y-20,'MOON LASER','#b8f0ff');}
  S.stats.moonShots=(S.stats.moonShots||0)+1;return true;}
function moonFireBtn(show){const b=$('#moonfire');if(!b)return;
  const ready=moonLaserReady()&&inCombat()&&moonAtPlanet()===S.at&&!S.moon.travel;
  b.classList.toggle('hidden',!(show&&moonOwned()&&moonAtPlanet()===S.at&&!S.moon.travel&&(inCombat()||C.armadaWarn>0)));
  b.classList.toggle('ready',!!ready);b.style.setProperty('--fc',ready?'#9fe6ff':'#6a7aaa');
  const lb=b.querySelector('.lb');if(lb)lb.textContent=ready?'FIRE':(moonOwned()?Math.floor(clamp(S.moon.laserCharge/moonLaserChargeTime(),0,1)*100)+'%':'');}

/* Battle Moon art (lavender-blue lit metal) */
function moonArt(x,R0){
  x.beginPath();x.arc(0,0,R0,0,TAU);const g=x.createRadialGradient(-R0*.35,-R0*.4,R0*.1,0,0,R0);g.addColorStop(0,'#e8eeff');g.addColorStop(.35,'#9fb0ff');g.addColorStop(.7,'#3a4a8a');g.addColorStop(1,'#121a3a');x.fillStyle=g;x.fill();
  x.save();x.clip();x.strokeStyle='rgba(20,30,70,.45)';x.lineWidth=1;for(let i=-4;i<=4;i++){x.beginPath();x.moveTo(i*R0*.22,-R0);x.lineTo(i*R0*.22,R0);x.stroke();}
  for(let j=-3;j<=3;j++){x.beginPath();x.moveTo(-R0,j*R0*.28);x.lineTo(R0,j*R0*.28);x.stroke();}
  /* crater wells */
  for(const [cx,cy,cr] of [[-.35,-.2,.18],[.4,.15,.14],[-.1,.4,.12],[.25,-.4,.1]]){const cg=x.createRadialGradient(cx*R0,cy*R0,0,cx*R0,cy*R0,cr*R0);cg.addColorStop(0,'rgba(10,16,40,.7)');cg.addColorStop(1,'rgba(10,16,40,0)');x.fillStyle=cg;x.beginPath();x.arc(cx*R0,cy*R0,cr*R0,0,TAU);x.fill();}
  x.restore();
  x.strokeStyle='#c5d0ff';x.lineWidth=Math.max(1.5,R0*.06);x.beginPath();x.arc(0,0,R0,0,TAU);x.stroke();
  /* ring deck */
  x.strokeStyle='rgba(159,176,255,.55)';x.lineWidth=Math.max(2,R0*.1);x.beginPath();x.ellipse(0,0,R0*1.28,R0*.42,-.3,0,TAU);x.stroke();
  /* laser hardpoint */
  x.fillStyle='#1a2458';x.beginPath();x.arc(R0*.55,-R0*.15,R0*.22,0,TAU);x.fill();x.strokeStyle='#9fe6ff';x.lineWidth=1.5;x.stroke();
  const lg=x.createRadialGradient(R0*.55,-R0*.15,0,R0*.55,-R0*.15,R0*.16);lg.addColorStop(0,'#fff');lg.addColorStop(.4,'#9fe6ff');lg.addColorStop(1,'#2a5080');x.fillStyle=lg;x.beginPath();x.arc(R0*.55,-R0*.15,R0*.12,0,TAU);x.fill();
  /* turrets */
  for(const a of[-.9,-.3,.4,1.0]){const tx=Math.cos(a)*R0*.85,ty=Math.sin(a)*R0*.85;x.fillStyle='#2a3a7a';x.beginPath();x.arc(tx,ty,R0*.12,0,TAU);x.fill();x.strokeStyle='#b8c4ff';x.lineWidth=1;x.stroke();}}
function moonSpr(R0){const S=Math.ceil(R0*2.9);return sprite('bmoon:'+Math.round(R0),S,S,(x,w,h)=>{x.translate(w/2,h/2);moonArt(x,R0);});}
function drawBattleMoon(t){if(!moonOwned()||S.moon.travel)return;if(R.tab==='map')return;if(moonAtPlanet()!==S.at||S.travel)return;
  const mp=moonPos(),R0=Math.max(28,Math.min(W,H)*.09);ctx.save();
  blit(moonSpr(R0),mp.x,mp.y);
  /* turret tracking beams when fighting */
  if(moonDefending()){const targets=C.enemies.filter(e=>e.vis>.5&&e.state!=='flee');const nT=Math.min(moonTurrets(),4);
    for(let k=0;k<nT;k++){if(!targets.length)break;const e=targets[k%targets.length];if(Math.sin(t*30+k)<.2)continue;
      ctx.strokeStyle='rgba(159,230,255,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(mp.x,mp.y);ctx.lineTo(e.x,e.y);ctx.stroke();}}
  if(R.moonLaserFx>0){const k=R.moonLaserFx/1.1;const a=R.moonLaserFrom||mp,b=R.moonLaserTo||{x:W/2,y:H*.3};
    ctx.lineCap='round';for(const [lw,col] of [[18*k,'rgba(120,220,255,.3)'],[7*k,'rgba(180,240,255,.85)'],[2.5,'#fff']]){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
    ctx.globalCompositeOperation='lighter';glow('#9fe6ff',b.x,b.y,40*k,.7,true);ctx.globalCompositeOperation='source-over';R.moonLaserFx-=1/60;}
  /* HP bar */
  if(inCombat()||(S.moon.hp>0&&S.moon.hp<moonMaxHp())){const w=R0*2,y=mp.y-R0-10;ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(mp.x-w/2-1,y-1,w+2,5);ctx.fillStyle='#9fe6ff';ctx.fillRect(mp.x-w/2,y,w*clamp(S.moon.hp/moonMaxHp(),0,1),3);}
  ctx.restore();}
function drawMoonMap(t){if(!moonOwned())return;const m=S.moon;let x,y;
  if(m.travel){const a=mapPos(P[m.travel.from]),b=mapPos(P[m.travel.to]),k=clamp((Date.now()-m.travel.start)/m.travel.dur,0,1);x=lerp(a.x,b.x,k);y=lerp(a.y,b.y,k);
    ctx.strokeStyle='rgba(159,176,255,.5)';ctx.lineWidth=1.2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);}
  else{const p=mapPos(P[m.at]);x=p.x+14;y=p.y-14;}
  ctx.save();ctx.translate(x,y);const r=7;blit(moonSpr(r*1.1),0,0);ctx.restore();}

/* wrap combat systems */
(function(){
  const _uc=updateCombat;updateCombat=function(dt,t){
    if(C.armadaWarn>0){C.armadaWarn-=dt;if((C._awPulse=(C._awPulse||0)+dt)>2){C._awPulse=0;C.shake=Math.max(C.shake,3);}if(C.armadaWarn<=0)startArmada();}
    _uc(dt,t);
    updateMoonCombat(dt,t);updateHaul(dt);softCapEnemyAI();
    if(moonDefending()&&C.shots.length){for(let i=C.shots.length-1;i>=0;i--){if(moonPointDefense(C.shots[i]))C.shots.splice(i,1);}}
  };
  const _dc=drawCombat;drawCombat=function(dt,t){_dc(dt,t);drawBattleMoon(t);drawHaul(t);
    if(C.armadaWarn>0){ctx.font='900 '+Math.round(Math.min(W,H)*.06)+'px system-ui,sans-serif';ctx.textAlign='center';
      ctx.fillStyle=`rgba(255,60,90,${.55+.45*Math.sin(t*10)})`;ctx.fillText('ARMADA INCOMING',W/2,H*.58);
      ctx.font='bold 14px system-ui,sans-serif';ctx.fillStyle='#ffd0d8';ctx.fillText(Math.ceil(C.armadaWarn)+'s — move Battle Moon · charge lasers',W/2,H*.58+24);}};
  const _ct=combatTap;combatTap=function(x,y){if(tapHaul(x,y))return true;return _ct(x,y);};
  const _dm=drawMap;drawMap=function(t){_dm(t);drawMoonMap(t);};
  const _jg=jumpGalaxy;jumpGalaxy=function(){_jg();moonOnJump();};
  const _rw=remapWorld;remapWorld=function(oW,oH){_rw(oW,oH);if(C.haul){const fx=W/oW,fy=H/oH;for(const c of C.haul.crates){c.x*=fx;c.y*=fy;}}};
  const _ds=damageStation;damageStation=function(d){if(moonDefending()&&S.moon.hp>0){const soak=d*.35;S.moon.hp-=soak;if(S.moon.hp<=0){S.moon.hp=0;floatText(moonPos().x,moonPos().y,'Battle Moon disabled!','#ff9aa8');toast('Battle Moon hull breached — retreating to repair','');}
    return _ds(d*.65);}return _ds(d);};
})();

function softCapEnemyAI(){if(!C.raid||!C.raid.armada)return;const live=C.enemies;if(live.length<=48)return;
  const g=R.geo;if(!g)return;const scored=live.map(e=>({e,d:Math.hypot(e.x-g.sx,e.y-g.sy)}));scored.sort((a,b)=>a.d-b.d);
  for(let i=48;i<scored.length;i++){const e=scored[i].e;if(e.type==='mothership'||e.state==='flee'||e.loot)continue;e._soft=true;
    const a=Math.atan2(e.y-g.sy,e.x-g.sx)+.02;e.vx=Math.cos(a)*8;e.vy=Math.sin(a)*8;}}

function moonPanelCard(pn){

/* Front-line minigame: Ace-Duel style multi-ship skirmish */
MGK.frontline={title:'Front-Line Battle',stick:true,
  init(){const W=MG.W,H=MG.H,m=Math.min(W,H),d=mgDiff(MG.fid||'patrol'),id=MG.fid,opp=MG.opp||'pirate';
    const me={x:W*.5,y:H*.78,a:-Math.PI/2,v:m*.3,hp:1,cd:0,bcd:0,burst:0,inv:0};
    const allies=[];for(let i=0;i<2+(d>1.3?1:0);i++)allies.push({x:W*(.28+.22*i),y:H*.82,a:-Math.PI/2,v:m*.28,hp:1,cd:.5+i*.2,fid:id});
    const foes=[];const nF=4+Math.min(2,Math.floor(d));for(let i=0;i<nF;i++)foes.push({x:W*(.18+.16*i),y:H*(.16+.08*(i%2)),a:Math.PI/2,v:m*.36,hp:55*d,max:55*d,cd:1+Math.random(),mode:'attack',mt:2,flash:0,jink:1,fid:opp});
    return {d,m,T:75,me,allies,foes,shots:[],kills:0,end:0,opp};},
  resize(oW,oH){const s=MG.st;for(const o of [s.me,...s.allies,...s.foes,...s.shots]){o.x*=MG.W/oW;o.y*=MG.H/oH;}s.m=Math.min(MG.W,MG.H);},
  tap(s){if(s.me.bcd<=0){s.me.burst=3;s.me.bcd=1.1;}},
  fire(s,o,own,spd,err,dmg){const a=o.a+(Math.random()-.5)*err;s.shots.push({x:o.x+Math.cos(o.a)*14,y:o.y+Math.sin(o.a)*14,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1.5,own,dmg});},
  step(s,dt){const W=MG.W,H=MG.H,m=s.m,me=s.me,d=s.d,top=64;if(s.end){s.end-=dt;if(s.end<=0)this.finish(s);return;}
    const st=mgStick();if(st.m>0){const ta=Math.atan2(st.y,st.x);me.a+=clamp(angD(me.a,ta),-4.2*dt,4.2*dt);}me.v=m*(.3+.38*st.m);
    me.x=clamp(me.x+Math.cos(me.a)*me.v*dt,16,W-16);me.y=clamp(me.y+Math.sin(me.a)*me.v*dt,top,H-16);
    me.cd-=dt;me.bcd-=dt;me.inv=Math.max(0,me.inv-dt);
    const liveF=()=>s.foes.filter(f=>f.hp>0);let nearest=null,nd=1e9;for(const f of liveF()){const dd=Math.hypot(f.x-me.x,f.y-me.y);if(dd<nd){nd=dd;nearest=f;}}
    if(me.burst>0&&me.cd<=0){me.burst--;me.cd=.07;this.fire(s,me,'p',m*1.5,.12,7);sfx('zap');}
    else if(nearest&&me.cd<=0&&Math.abs(angD(me.a,Math.atan2(nearest.y-me.y,nearest.x-me.x)))<.32&&nd<m*.9){me.cd=.15;this.fire(s,me,'p',m*1.5,.07,6);sfx('zap');}
    /* allies */
    for(const a of s.allies){if(a.hp<=0)continue;let tgt=null,td=1e9;for(const f of liveF()){const dd=Math.hypot(f.x-a.x,f.y-a.y);if(dd<td){td=dd;tgt=f;}}
      if(tgt){const ta=Math.atan2(tgt.y-a.y,tgt.x-a.x);a.a+=clamp(angD(a.a,ta),-2.4*dt,2.4*dt);a.v=m*.32;a.cd-=dt;if(a.cd<=0&&td<m*.75&&Math.abs(angD(a.a,ta))<.4){a.cd=.28;this.fire(s,a,'al',m*1.2,.15,4);}}
      else{a.v=m*.15;}a.x=clamp(a.x+Math.cos(a.a)*a.v*dt,14,W-14);a.y=clamp(a.y+Math.sin(a.a)*a.v*dt,top,H-14);}
    /* foes AI */
    for(const A of s.foes){if(A.hp<=0)continue;A.mt-=dt;A.flash=Math.max(0,A.flash-dt);if(A.mt<=0){A.mode=A.mode==='attack'?'evade':'attack';A.mt=A.mode==='attack'?2+Math.random():.8+Math.random()*.6;A.jink=Math.random()<.5?-1:1;}
      const lead=Math.hypot(me.x-A.x,me.y-A.y)/(m*1.0);let ta=Math.atan2((me.y+Math.sin(me.a)*me.v*lead)-A.y,(me.x+Math.cos(me.a)*me.v*lead)-A.x);
      if(A.mode==='evade')ta=Math.atan2(A.y-me.y,A.x-me.x)+A.jink*1.1;A.a+=clamp(angD(A.a,ta),-2.6*d*dt,2.6*d*dt);A.v=m*.36*(A.mode==='evade'?1.12:1);
      A.x=clamp(A.x+Math.cos(A.a)*A.v*dt,14,W-14);A.y=clamp(A.y+Math.sin(A.a)*A.v*dt,top,H-14);
      A.cd-=dt;const toMe=Math.atan2(me.y-A.y,me.x-A.x);if(A.cd<=0&&A.mode==='attack'&&Math.abs(angD(A.a,toMe))<.28){A.cd=.6/d;this.fire(s,A,'e',m*.9,.35/d,6*(.8+.2*d));}}
    const rE=clamp(m*.048,14,22),rM=rE*.85;
    for(let i=s.shots.length-1;i>=0;i--){const b=s.shots[i];b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;let hit=false;
      if(b.own==='p'||b.own==='al'){for(const A of s.foes){if(A.hp<=0)continue;if(Math.hypot(b.x-A.x,b.y-A.y)<rE){hit=true;let dm=b.dmg;const cr=rollCrit(true);if(cr){dm*=2;mgFloat(A.x,A.y-18,'CRIT','#ffb347');}A.hp-=dm;A.flash=.1;mgPart(b.x,b.y,5,'#ffd36b');if(A.hp<=0){s.kills++;mgPart(A.x,A.y,40,'#ffb070',220);sfx('boom');}break;}}}
      else if(b.own==='e'){if(me.inv<=0&&Math.hypot(b.x-me.x,b.y-me.y)<rM){hit=true;me.hp-=b.dmg/100;me.inv=.12;MG.shake=5;mgPart(b.x,b.y,8,'#ff7a3a');sfx('hit');vib(12);}
        for(const a of s.allies){if(a.hp<=0)continue;if(Math.hypot(b.x-a.x,b.y-a.y)<rM){hit=true;a.hp-=b.dmg/90;mgPart(b.x,b.y,6,'#ff7a3a');if(a.hp<=0){mgPart(a.x,a.y,24,'#9fe6ff',160);sfx('boom');}break;}}}
      if(hit||b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)s.shots.splice(i,1);}
    if(!liveF().length&&!s.end){s.win=true;s.end=1.2;MG.shake=10;sfx('boom');vib([30,40,60]);}
    else if(me.hp<=0&&!s.end){s.win=false;s.end=1.1;mgPart(me.x,me.y,50,'#9fe6ff',220);MG.shake=10;sfx('boom');}
    else if(MG.t>=s.T&&!s.end){s.win=liveF().length<=Math.floor(s.foes.length/3);s.end=.2;}},
  finish(s){const id=MG.fid,opp=s.opp||MG.opp;const hp=clamp(s.me.hp,0,1);
    if(s.win){applyWarWin(id);ensureWar().wins++;hurtRep(opp,8);mgEnd('Front secured!',[`Kills ${s.kills} · hull ${Math.round(hp*100)}% · ${FAC[id].name} advances`],{secs:45*(.75+.25*hp),salvage:12*eScale(),rep:18},true);}
    else{applyWarLoss(id,opp);mgEnd('Forced back',[`Kills ${s.kills} · the front buckles`],{secs:12,rep:5},false);}
    if(R.tab==='factions'||R.tab==='map')renderPanel();},
  hud(s){return `<b>${fmtClock(s.T-MG.t)}</b> · Hostiles ${s.foes.filter(f=>f.hp>0).length}/${s.foes.length} · Kills ${s.kills}`;},
  draw(x,s,dt,t){const W=MG.W,H=MG.H,m=s.m,id=MG.fid,opp=s.opp;mgBg(x,W,H,dt,.03,FAC[id]?210:220);const r=clamp(m*.048,14,22);
    x.globalCompositeOperation='lighter';for(const b of s.shots)mgGlow(x,b.own==='e'?'#ff7a3a':'#5fd0ff',b.x,b.y,7,1);x.globalCompositeOperation='source-over';
    for(const b of s.shots){x.strokeStyle=b.own==='e'?'#ffd0a8':'#dff6ff';x.lineWidth=2;x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x-b.vx*.02,b.y-b.vy*.02);x.stroke();}
    for(const A of s.foes){if(A.hp<=0&&!(s.end>.8))continue;x.save();x.translate(A.x,A.y);x.rotate(A.a);const sp=pirSpr('raider',r);x.drawImage(sp,-sp.cw/2,-sp.ch/2,sp.cw,sp.ch);if(A.flash>0){x.globalAlpha=.7;const w=pirSpr('raider',r,true);x.drawImage(w,-w.cw/2,-w.ch/2,w.cw,w.ch);x.globalAlpha=1;}x.restore();
      if(A.hp>0)mgBar(x,A.x-r,A.y-r-10,r*2,3,A.hp/A.max,FAC[opp]?FAC[opp].col:'#ff5a6a');}
    for(const a of s.allies){if(a.hp<=0)continue;x.save();x.translate(a.x,a.y);x.rotate(a.a);const sp=shipSpr('fighter',r*.75,FAC[id].acc);x.drawImage(sp,-sp.cw/2,-sp.ch/2,sp.cw,sp.ch);x.restore();}
    const me=s.me;if(me.hp>0){x.save();x.translate(me.x,me.y);x.rotate(me.a);x.globalCompositeOperation='lighter';mgGlow(x,'#5fd0ff',-r*.9,0,r*.55*(1+.4*Math.sin(t*30)),.9,true);x.globalCompositeOperation='source-over';const sp=shipSpr('fighter',r*.9,'#ffd36b');x.drawImage(sp,-sp.cw/2,-sp.ch/2,sp.cw,sp.ch);x.restore();}
    mgBar(x,12,H-24,Math.min(160,W*.4),8,me.hp,me.hp>.35?'#3ee0a0':'#ff5a5a','HULL');
    if(MG.t<3){x.font='bold 14px system-ui,sans-serif';x.textAlign='center';x.fillStyle=`rgba(255,255,255,${.7+.3*Math.sin(t*4)})`;x.fillText('Front-line: drag to steer · tap for burst',W/2,H*.55);x.fillText('Allies fight beside you',W/2,H*.55+20);}}};

function drawFactionBorders(t){if(!warUnlocked()||!P||P.length<2)return;warTick();

  for(const p of P){if(p.i===0)continue;const own=planetOwner(p.i);if(!own)continue;const q=mapPos(p),r=mapR(p)+18;const col=FAC[own].col;
    const g=ctx.createRadialGradient(q.x,q.y,r*.2,q.x,q.y,r);g.addColorStop(0,col+'33');g.addColorStop(1,col+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,r,0,TAU);ctx.fill();
    /* banner pip */
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(q.x+r*.55,q.y-r*.9);ctx.lineTo(q.x+r*.55+7,q.y-r*.9+3);ctx.lineTo(q.x+r*.55,q.y-r*.9+6);ctx.closePath();ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(q.x+r*.55,q.y-r*.9);ctx.lineTo(q.x+r*.55,q.y-r*.9+11);ctx.stroke();}
  /* border lines between different owners */

  for(let i=1;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=planetOwner(i),b=planetOwner(j);if(!a||!b||a===b)continue;const pa=mapPos(P[i]),pb=mapPos(P[j]);if(Math.hypot(pa.x-pb.x,pa.y-pb.y)>Math.min(W,H)*.42)continue;
    ctx.strokeStyle='rgba(200,210,255,.28)';ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();}
  ctx.setLineDash([]);
  /* hub contested ring */
  const h=mapPos(P[0]),hr=mapR(P[0])+8;ctx.strokeStyle='rgba(255,211,107,.45)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(h.x,h.y,hr,0,TAU);ctx.stroke();ctx.setLineDash([]);
}

function applyUniverseModifier(){if(!P||!S.prestige)return;const u=S.prestige.universe|0;if(!u)return;

function startNgWarp(done){

  ensureWarpEl();const w=$('#warp');w.classList.remove('hidden');

function ensureWarpEl(){let w=$('#warp');if(w)return w;w=document.createElement('div');w.id='warp';w.className='hidden';
  w.innerHTML='<canvas id="warpcv"></canvas><div class="wlabel"></div><button class="btn ghost wskip"><span class="l">Skip</span></button>';
  document.body.appendChild(w);return w;}
function ngWarpFrame(dt){
  const Wrp=R.ngWarp;if(!Wrp||Wrp.done)return false;
  Wrp.t+=dt;if(Wrp.skip&&Wrp.t<Wrp.T-.2)Wrp.t=Math.max(Wrp.t,Wrp.T-.15);
  const w=$('#warp'),cv=$('#warpcv');if(!w||!cv)return true;
  const dpr=Math.min(2,window.devicePixelRatio||1);const WW=window.innerWidth,HH=window.innerHeight;
  if(cv.width!==Math.floor(WW*dpr)){cv.width=Math.floor(WW*dpr);cv.height=Math.floor(HH*dpr);cv.style.width=WW+'px';cv.style.height=HH+'px';}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const t=Wrp.t,tint=S.prestige?S.prestige.tint:210,lvl=ngLevel();
  /* background */
  x.fillStyle='#02030a';x.fillRect(0,0,WW,HH);
  const streak=clamp(t/1.2,0,1);
  x.save();x.translate(WW/2,HH/2);
  for(let i=0;i<120;i++){const a=(i/120)*TAU+t*.2,len=(40+i%50)*streak*(1+t),r0=8+(i%40);x.strokeStyle=`hsla(${(tint+i*3)%360},80%,70%,${.15+.5*streak})`;x.lineWidth=1+(i%3);x.beginPath();x.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);x.lineTo(Math.cos(a)*(r0+len),Math.sin(a)*(r0+len));x.stroke();}
  /* station needle */
  const sn=clamp((t-.3)/1.2,0,1);const ss=lerp(28,4,sn);x.rotate(t*2);x.fillStyle='#9fe6ff';x.beginPath();x.moveTo(ss*2,0);x.lineTo(-ss,.6*ss);x.lineTo(-ss,-.6*ss);x.closePath();x.fill();
  if(curFac()){x.strokeStyle=FAC[curFac()].col;x.lineWidth=2;x.beginPath();x.moveTo(-ss*3,0);x.lineTo(-ss*8-40*sn,0);x.stroke();}
  x.restore();
  /* color wash */
  if(t>1.0){const k=clamp((t-1)/1.2,0,1);x.fillStyle=`hsla(${tint},70%,40%,${.15*k})`;x.fillRect(0,0,WW,HH);
    if(t>1.8&&t<2.3){const f=1-Math.abs(t-2.05)/.25;x.fillStyle=`rgba(255,255,255,${.85*clamp(f,0,1)})`;x.fillRect(0,0,WW,HH);}}
  const lab=w.querySelector('.wlabel');if(lab){if(t<1.2)lab.textContent='Warping to another universe…';else if(t<2.4)lab.textContent='Universe '+((S.prestige&&S.prestige.universe)||1)+' unfolding…';else lab.innerHTML='<b>NEW GAME+</b> · Level '+lvl+'<br><span>Universe '+(S.prestige?S.prestige.universe:1)+'</span>';}
  const sb=w.querySelector('.wskip');if(sb)sb.style.opacity=t>=WARP_SKIP_AFTER?'1':'.35';
  if(t>=Wrp.T){Wrp.done=true;w.classList.add('hidden');R.ngWarp=null;if(Wrp.cb)Wrp.cb();return false;}
  return true;
}

function frame(ts){
  let dt=(ts-lastT)/1000;lastT=ts;if(!(dt>=0))dt=0;dt=Math.min(dt,.25);
  const now=Date.now(),t=ts/1000;
  try{
    accrueOutposts(now); // outposts: always, based on wall-clock
    updateTravel(now);
    if(!document.hidden){
      S.stats.play+=dt;
      C.grace=Math.max(0,C.grace-dt);
      updateOutpostRaid(dt);ensureColony();colonyStep(dt,1);
      if(!S.travel){addSplit(stationRate()*dt,P[S.at].w);if(laserOwned())S.laserCharge=Math.min(chargeTime(),S.laserCharge+dt*(inCombat()?3:1));if(R.tab!=='map'&&!MG.on)updateCombat(dt,t);} // combat pauses while a faction minigame is open // station & Super Laser: only while visible
      if(!inCombat()&&!MG.on)R.evtT-=dt;if(R.evtT<=0){R.evtT=70+Math.random()*90;if(!S.travel){if(Math.random()<.62){R.showerUntil=t+14;R.nextRock=t;toast('Asteroid shower incoming!','gold');}else{flareUntil=performance.now()+30000;toast('Solar flare! Station output ×3 for 30s','gold');}}}
      if(t<R.showerUntil&&t>=R.nextRock&&!S.travel&&R.tab!=='map'&&R.tab!=='colony'){spawnRock();R.nextRock=t+.9+Math.random()*.8;}
    }
    if(MG.on)mgFrame(dt,t);
    else if(R.tab==='map'){drawBackground(dt,.0015);drawMap(t);}
    else if(colonyViewOn()){drawBackground(dt,.0015);drawColony(dt,t);}
    else if(S.travel){drawBackground(dt,1.2);drawTravel(dt,t);drawFx(dt);}
    else{const sh=C.shake;if(sh>0){ctx.save();ctx.translate((Math.random()-.5)*sh*2,(Math.random()-.5)*sh*2);}drawBackground(dt,.003);drawOrbit(dt,t);drawFx(dt);if(sh>0)ctx.restore();}
    if(R.tab==='map'&&R.warpFlash>0)drawFx(dt);
    uiAcc+=dt;if(uiAcc>.2){uiAcc=0;updTop();if(!R.fs)runUpd();}
    achAcc+=dt;if(achAcc>1){achAcc=0;checkAch();updateBadges();}
    saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}
    abAcc+=dt;if(abAcc>2){abAcc=0;if(S.autobuy&&S.galaxy>=1&&!document.hidden)autoBuy();}
  }catch(e){console.error(e);}
  requestAnimationFrame(frame);
}
